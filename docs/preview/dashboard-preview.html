<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板预览 · 企业应收账款台账系统</title>
<style>
/* ==========================================================================
   企业应收账款台账系统 · 样式表
   设计语言：账簿工业风 Ledger Industrial（精确 / 稳重 / 克制）
   上下文见 .impeccable.md；令牌改动请同步该文件

   分层：① 设计令牌 ② 基础与排版 ③ 原子 ④ 组件 ⑤ 响应式 ⑥ 打印
   ========================================================================== */

/* ==========================================================================
   ① 设计令牌
   ========================================================================== */
:root {
  /* — 中性色阶（冷调灰，色相偏主色 258°，避免"死灰"） — */
  --ink-950: oklch(21% 0.030 258);
  --ink-900: oklch(28% 0.028 258);   /* 侧边栏底色 */
  --ink-800: oklch(35% 0.024 258);
  --ink-700: oklch(42% 0.021 258);   /* 正文主色 */
  --ink-600: oklch(51% 0.019 258);   /* 正文次色 */
  --ink-500: oklch(60% 0.017 258);   /* 辅助文本（12px 下限） */
  --ink-400: oklch(72% 0.013 258);   /* 占位/禁用 */
  --ink-300: oklch(80% 0.012 258);   /* 深底上的文本 */
  --ink-100: oklch(93% 0.008 258);

  --line: oklch(91.5% 0.008 258);    /* 发丝分隔线 */
  --line-2: oklch(85.5% 0.012 258);  /* 强分隔线 / 控件描边 */

  --bg: oklch(96.8% 0.006 258);      /* 页面底 */
  --surface: oklch(99.4% 0.002 258); /* 卡片/表格底（非纯白） */
  --surface-2: oklch(98.1% 0.005 258); /* 斑马行 / 次级面板 */
  --surface-3: oklch(95.4% 0.008 258); /* 表头底 / 悬浮态 */

  /* — 主色：深靛蓝（区别于默认亮蓝，稳重可信） — */
  --primary: oklch(45% 0.130 258);
  --primary-600: oklch(39.5% 0.130 258);
  --primary-soft: oklch(95% 0.032 258);
  --primary-line: oklch(86% 0.065 258);

  /* — 语义色（朱砂红为唯一"警示"强调色，仅用于风险与危险操作） — */
  --danger: oklch(50% 0.185 28);
  --danger-600: oklch(43% 0.175 28);
  --danger-soft: oklch(96% 0.028 28);
  --danger-line: oklch(87% 0.070 28);

  --ok: oklch(50% 0.110 152);
  --ok-soft: oklch(96% 0.030 152);
  --ok-line: oklch(87% 0.065 152);

  --warn: oklch(52% 0.120 66);
  --warn-soft: oklch(96.5% 0.035 78);
  --warn-line: oklch(87% 0.080 78);

  --teal: oklch(47% 0.088 195);
  --teal-soft: oklch(96% 0.025 195);
  --violet: oklch(45% 0.140 300);
  --violet-soft: oklch(96% 0.025 300);

  --focus: oklch(58% 0.155 258);

  /* — 排版 — */
  --font: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI",
          system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --t-xs: 0.75rem;      /* 12px 辅助说明 */
  --t-sm: 0.8125rem;    /* 13px 表格单元格 */
  --t-base: 0.875rem;   /* 14px 正文 */
  --t-md: 1rem;         /* 16px 页面标题 */
  --t-lg: 1.125rem;     /* 18px 区块标题 */
  --t-xl: 1.375rem;     /* 22px 弹窗标题 */
  --t-2xl: 1.75rem;     /* 28px KPI 数字 */
  --lh-tight: 1.35;
  --lh-base: 1.55;

  /* — 空间（4 的倍数，按角色取用，制造节奏而非平铺） — */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px;

  /* — 圆角（收敛到三档，不再出现 8/12/14 混用） — */
  --r1: 4px; --r2: 6px; --r3: 10px; --r-pill: 999px;

  /* — 阴影：卡片靠发丝线，浮层才用阴影 — */
  --sh1: 0 1px 2px oklch(21% 0.03 258 / 0.05);
  --sh2: 0 6px 18px oklch(21% 0.03 258 / 0.10);
  --sh3: 0 18px 48px oklch(21% 0.03 258 / 0.18);

  /* — 动效：只动 transform/opacity/color，指数缓出 — */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-f: 120ms;
  --dur: 200ms;

  /* 表格行底色（供冻结列继承，避免透明穿帮） */
  --row-bg: var(--surface);
  --row-alt: oklch(97.7% 0.006 258);   /* 斑马行：原为 surface-2（98.1%），与白底差 1.3% 实际看不出来 */
  --row-hover: oklch(96.5% 0.013 258); /* 必须比斑马行更深，否则偶数行 hover 反而变浅 */
  --row-checked: var(--primary-soft);
  --thead-bg: var(--surface-3);
  --thead-fc-bg: oklch(93.6% 0.010 258); /* 冻结区表头（比表头底再深一档，标示"这列被冻住了"） */
  --foot-bg: oklch(96.2% 0.010 258);
}

/* ==========================================================================
   ② 基础与排版
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
#root { min-height: 100vh; }

body {
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: var(--lh-base);
  font-kerning: normal;
  background: var(--bg);
  color: var(--ink-700);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--primary); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }

h1, h2, h3, h4 { color: var(--ink-950); line-height: var(--lh-tight); font-weight: 600; }
h1 { font-size: var(--t-xl); }
h2 { font-size: var(--t-md); }
h3 { font-size: var(--t-base); }

::selection { background: oklch(88% 0.06 258); color: var(--ink-950); }

/* 焦点可见性（键盘用户专用，鼠标点击不出现） */
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r1);
}
:focus:not(:focus-visible) { outline: none; }

/* ==========================================================================
   ③ 原子
   ========================================================================== */
.hidden { display: none !important; }
.muted { color: var(--ink-500); font-size: var(--t-xs); }
.ta-r { text-align: right; }
.text-danger { color: var(--danger); }
.text-ok { color: var(--ok); }
.page { display: block; }

/* ==========================================================================
   ④ 组件
   ========================================================================== */

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  padding: 6px 13px; min-height: 30px;
  border: 1px solid var(--line-2); border-radius: var(--r2);
  background: var(--surface); color: var(--ink-700);
  font-family: var(--font); font-size: var(--t-base); line-height: 1.2;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-f) var(--ease), border-color var(--dur-f) var(--ease),
              color var(--dur-f) var(--ease), transform var(--dur-f) var(--ease);
}
.btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[disabled] { opacity: 0.42; cursor: not-allowed; transform: none; }
.btn:disabled:hover { border-color: var(--line-2); color: var(--ink-700); background: var(--surface); }

.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--surface); }
.btn-primary:hover { background: var(--primary-600); border-color: var(--primary-600); color: var(--surface); }
.btn-primary:disabled:hover { background: var(--primary); border-color: var(--primary); }

.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn-danger:hover { background: var(--danger-600); border-color: var(--danger-600); color: var(--surface); }

.btn-danger-plain { color: var(--danger); border-color: var(--danger-line); background: var(--surface); }
.btn-danger-plain:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

.btn-xs { padding: 3px 9px; min-height: 24px; font-size: var(--t-xs); border-radius: var(--r1); }
.btn-sm { padding: 5px 11px; min-height: 28px; font-size: var(--t-sm); }
.btn-lg { padding: 10px 26px; min-height: 42px; font-size: var(--t-md); }
.btn-block { width: 100%; }

/* ---------- 输入控件 ---------- */
.ipt {
  padding: 6px 10px; min-height: 30px;
  border: 1px solid var(--line-2); border-radius: var(--r2);
  background: var(--surface); color: var(--ink-700);
  font-family: var(--font); font-size: var(--t-base); line-height: 1.3;
  transition: border-color var(--dur-f) var(--ease), box-shadow var(--dur-f) var(--ease);
}
.ipt::placeholder { color: var(--ink-400); }
.ipt:focus { border-color: var(--primary); box-shadow: 0 0 0 3px oklch(45% 0.13 258 / 0.13); outline: none; }
.ipt:disabled { background: var(--surface-2); color: var(--ink-500); cursor: not-allowed; }
textarea.ipt { min-height: 62px; line-height: var(--lh-base); resize: vertical; }
select.ipt { padding-right: 26px; cursor: pointer; }

/* ---------- 登录页 ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: var(--s5);
  background:
    radial-gradient(120% 80% at 50% -20%, oklch(94% 0.020 258) 0%, transparent 60%),
    repeating-linear-gradient(0deg, oklch(93% 0.008 258 / 0.5) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, oklch(93% 0.008 258 / 0.5) 0 1px, transparent 1px 32px),
    var(--bg);
}
.login-card {
  width: 396px; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r3); padding: var(--s6) var(--s6) var(--s5);
  box-shadow: var(--sh3);
}
.login-logo {
  width: 46px; height: 46px; margin-bottom: var(--s4);
  border-radius: var(--r2); background: var(--ink-900);
  color: var(--surface); font-size: 22px; line-height: 46px; font-weight: 600;
  text-align: center; letter-spacing: 0;
}
.login-title { font-size: var(--t-lg); font-weight: 600; margin-bottom: var(--s1); letter-spacing: -0.01em; }
.login-sub { font-size: var(--t-sm); color: var(--ink-500); margin-bottom: var(--s5); }
.login-form { display: flex; flex-direction: column; gap: var(--s3); }
.login-form .form-field { gap: 5px; }
.login-foot {
  margin-top: var(--s5); padding-top: var(--s3);
  border-top: 1px solid var(--line);
  font-size: var(--t-xs); color: var(--ink-500); line-height: 1.7;
}

/* ---------- 主框架 ---------- */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 210px; flex-shrink: 0; background: var(--ink-900); color: var(--ink-300);
  display: flex; flex-direction: column; position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
  border-right: 1px solid oklch(32% 0.02 258);
}
.side-brand {
  padding: var(--s5) var(--s4) var(--s4);
  font-size: 15px; font-weight: 600; color: var(--surface);
  letter-spacing: 0.02em; line-height: 1.45;
  border-bottom: 1px solid oklch(34% 0.02 258);
}
.side-nav { padding: var(--s3) var(--s2); display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: var(--s2);
  padding: 8px var(--s3); border: none; border-radius: var(--r2);
  background: transparent; color: var(--ink-300);
  font-family: var(--font); font-size: var(--t-base); text-align: left;
  cursor: pointer; width: 100%; position: relative;
  transition: background var(--dur-f) var(--ease), color var(--dur-f) var(--ease);
}
.nav-item:hover { background: oklch(34% 0.022 258); color: var(--surface); }
.nav-item.active {
  background: oklch(36% 0.045 258); color: var(--surface); font-weight: 500;
}
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
  background: oklch(72% 0.11 258); border-radius: 2px;
}
.nav-icon { width: 17px; text-align: center; opacity: 0.7; font-size: 13px; }
.nav-item.active .nav-icon { opacity: 1; }

.side-perms {
  margin-top: auto; padding: var(--s4) var(--s4) var(--s5);
  border-top: 1px solid oklch(34% 0.02 258);
}
.sp-title {
  font-size: 11px; color: oklch(72% 0.015 258);
  letter-spacing: 0.08em; text-transform: none; margin-bottom: var(--s2);
}
.perm-list { list-style: none; }
.perm-list li {
  display: flex; align-items: center; gap: 7px; padding: 2.5px 0;
  font-size: var(--t-xs); color: oklch(62% 0.014 258);
}
.perm-list li.on { color: var(--ink-300); }
.pm-icon { width: 13px; text-align: center; font-weight: 600; font-size: 11px; }
.perm-list li.on .pm-icon { color: oklch(78% 0.14 152); }
.perm-list li.off .pm-icon { color: oklch(46% 0.012 258); }

.app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  min-height: 54px; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s4);
  padding: 0 var(--s5); position: sticky; top: 0; z-index: 20;
}
.topbar-left { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.topbar-title {
  font-size: var(--t-md); font-weight: 600; color: var(--ink-950);
  letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-user { display: flex; align-items: center; gap: var(--s3); }
.user-dept {
  font-size: var(--t-xs); color: var(--primary); background: var(--primary-soft);
  border: 1px solid var(--primary-line); padding: 2px 10px; border-radius: var(--r-pill);
}
.user-name { font-size: var(--t-sm); font-weight: 500; color: var(--ink-700); }

.page-container { padding: var(--s4) var(--s5) var(--s7); flex: 1; min-width: 0; }
/* 台账总览：让表格吃掉剩余高度，页面自己不再产生第二条滚动条
   （旧实现用 max-height: calc(100vh - 252px) 猜顶部控件高度，加一行筛选就错位）。
   注意只给 #page-ledger 挂弹性链，不动 .page-container —— 否则看板等长页面
   会被压成"视口高 + 内容溢出"，容器自身的底部内边距就白给了。
   height:100% 能生效，是因为 .page-container 在 .app-main 里由 flex 定高。 */
#page-ledger:not(.hidden) {
  display: flex; flex-direction: column; height: 100%; min-height: 0;
}
#page-ledger #ledger-table-box { display: flex; flex-direction: column; flex: 1; min-height: 0; }
/* 表格卡片贴着数据收边（内容高就撑满、超出才出现内滚动），
   而不是拉成一个大白框、让合计行孤零零浮在中间 */
#page-ledger .table-wrap { flex: 0 1 auto; min-height: 0; max-height: 100%; }
/* 空状态没有"数据高度"可贴，若仍按内容收边就会在下方留一大片空白；
   这里让它吃掉剩余高度，把引导文案在可视区正中呈现 */
#page-ledger .table-wrap.is-empty { flex: 1 1 auto; max-height: 100%; }
.page-head { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.page-head h2 { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.01em; }
.page-head h3 { font-size: var(--t-base); }
.page-head .muted { flex: 1; min-width: 200px; }

/* ---------- 工具栏 / 筛选胶囊 ---------- */
.toolbar {
  display: flex; justify-content: space-between; align-items: center; gap: var(--s3);
  margin-bottom: var(--s2); flex-wrap: wrap;
}
.toolbar-left { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.toolbar-right { display: flex; gap: var(--s2); flex-wrap: wrap; }

.kw-input {
  width: 300px; padding: 6px 13px; min-height: 30px;
  border: 1px solid var(--line-2); border-radius: var(--r-pill);
  background: var(--surface); font-family: var(--font); font-size: var(--t-base); color: var(--ink-700);
  transition: border-color var(--dur-f) var(--ease), box-shadow var(--dur-f) var(--ease);
}
.kw-input::placeholder { color: var(--ink-400); }
.kw-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px oklch(45% 0.13 258 / 0.13); outline: none; }

.batch-chip {
  display: inline-flex; align-items: center; gap: var(--s1);
  background: var(--warn-soft); color: oklch(42% 0.11 66);
  border: 1px solid var(--warn-line); padding: 3px 12px; border-radius: var(--r-pill);
  font-size: var(--t-xs); font-weight: 500;
}
.batch-chip a { margin-left: var(--s1); font-weight: 600; color: inherit; }

/* 筛选区：5 行胶囊本身已占掉不少竖向空间，行距收紧一档把表格往上提 */
.capsule-row {
  display: flex; align-items: center; gap: 3px 5px; flex-wrap: wrap;
  margin-bottom: 4px;
}
.capsule-label {
  font-size: var(--t-xs); color: var(--ink-400);
  width: 56px; flex-shrink: 0; letter-spacing: 0.02em;
}
.capsule {
  padding: 3px 12px; border: 1px solid var(--line-2); border-radius: var(--r-pill);
  background: var(--surface); color: var(--ink-600);
  font-family: var(--font); font-size: var(--t-xs); line-height: 1.6;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-f) var(--ease), border-color var(--dur-f) var(--ease),
              color var(--dur-f) var(--ease);
}
.capsule:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.capsule.active {
  background: var(--primary); border-color: var(--primary); color: var(--surface); font-weight: 500;
}
/* 默认值（全部 / 未结）被选中时用淡色：实心蓝只表示"这一维真的筛过"，
   否则 5 行胶囊各挂一颗实心蓝，颜色不再承载任何信息 */
.capsule.active.is-default {
  background: var(--primary-soft); border-color: var(--primary-line);
  color: var(--primary); font-weight: 500;
}
.capsule.active.is-default:hover {
  background: oklch(92.5% 0.042 258); border-color: var(--primary);
}

/* ---------- 表格容器 ---------- */
.table-wrap {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2);
  overflow: auto; box-shadow: var(--sh1); overscroll-behavior: contain;
  max-height: calc(100vh - 252px);
}
.ledger-table, .map-table, .batch-table, .admin-table, .invoice-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: var(--t-sm); font-variant-numeric: tabular-nums;
}
.ledger-table th, .ledger-table td { padding: 6px 8px; }

/* 表头：固定 + 换行 + 发丝下沿 */
.ledger-table thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--thead-bg); color: var(--ink-600);
  font-weight: 600; font-size: var(--t-xs); line-height: var(--lh-tight);
  letter-spacing: 0.01em;
  padding: 8px; white-space: normal; word-break: break-word;
  vertical-align: middle; cursor: default;
  border-bottom: 1px solid var(--line-2);
  box-shadow: inset 0 -1px 0 var(--line), 0 1px 0 oklch(21% 0.03 258 / 0.03);
}
.ledger-table thead th.ta-r { padding-right: 10px; }
th[data-sort] { cursor: pointer; user-select: none; transition: color var(--dur-f) var(--ease); }
th[data-sort]:hover { color: var(--primary); background: var(--surface-2); }
th.sorted { color: var(--primary); }
th.sorted::after { content: "▾"; margin-left: 3px; font-size: 9px; opacity: 0.8; }

/* 数据行：行底色走变量，冻结列可继承（不透明，不穿帮） */
.ledger-table tbody tr { --row-bg: var(--surface); }
.ledger-table tbody tr:nth-child(even) { --row-bg: var(--row-alt); }
.ledger-table tbody tr:hover { --row-bg: var(--row-hover); }
.ledger-table tbody tr.row-checked { --row-bg: var(--row-checked); }
.ledger-table tbody td {
  background: var(--row-bg);
  border-bottom: 1px solid var(--line);
  padding: 6px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  vertical-align: middle; line-height: 1.5;
}
.ledger-table tbody tr:last-child td { border-bottom: none; }

/* 冻结列：左侧「勾选 + 序号」，右侧「操作」。
   ⚠️ 冻结列的【实际宽度】必须与 left 偏移严格相等。
   本表是 table-layout:auto，浏览器会把声明宽度向内容最小宽度回缩
   （勾选列声明 36px、实际只画到 29px），此时只写 width 会让冻结列
   比偏移窄，两列之间露出一条正在横向滚动的单元格 —— 表现为
   「序号冻结后左边有一片空白 / 穿帮」。故宽度只定义一次，三处锁死。 */
.ledger-table {
  --fc-check: 36px;                              /* 勾选列宽 */
  --fc-idx: 40px;                                /* 序号列宽 */
  --fc-act: 104px;                               /* 操作列宽 */
  --fc-w: calc(var(--fc-check) + var(--fc-idx)); /* 冻结区总宽 */
}
.ledger-table th.col-check, .ledger-table td.col-check {
  position: sticky; left: 0; z-index: 3;
  width: var(--fc-check); min-width: var(--fc-check); max-width: var(--fc-check);
  text-align: center;
}
.ledger-table th.col-idx, .ledger-table td.col-idx {
  position: sticky; left: var(--fc-check); z-index: 3;
  width: var(--fc-idx); min-width: var(--fc-idx); max-width: var(--fc-idx);
  text-align: center; color: var(--ink-500); font-size: var(--t-xs);
  box-shadow: inset -1px 0 0 var(--line);
}
.ledger-table th.col-actions, .ledger-table td.col-actions {
  position: sticky; right: 0; z-index: 3;
  width: var(--fc-act); min-width: var(--fc-act); max-width: var(--fc-act);
  box-shadow: inset 1px 0 0 var(--line);
}
.ledger-table thead th.col-check, .ledger-table thead th.col-idx,
.ledger-table thead th.col-actions { z-index: 8; }
/* 冻住的两列：表头底色再深一档，与右侧滑动区分开 */
.ledger-table thead th.col-check, .ledger-table thead th.col-idx { background: var(--thead-fc-bg); }

/* 横向滚动提示：只在确实还有内容被滚出去的那一侧投影（类名由 ledger.js 的 syncOverflow 维护） */
.table-wrap.is-scrolled .ledger-table th.col-idx,
.table-wrap.is-scrolled .ledger-table td.col-idx {
  box-shadow: inset -1px 0 0 var(--line), 12px 0 14px -12px oklch(21% 0.03 258 / 0.22);
}
.table-wrap.has-more .ledger-table th.col-actions,
.table-wrap.has-more .ledger-table td.col-actions {
  box-shadow: inset 1px 0 0 var(--line), -12px 0 14px -12px oklch(21% 0.03 258 / 0.22);
}

.col-actions { text-align: center; white-space: nowrap; }
.col-actions a { margin: 0 5px; font-size: var(--t-xs); }
.link-danger { color: var(--danger); }

/* 单元格语义 */
.td-money { font-variant-numeric: tabular-nums; letter-spacing: 0.005em; }
.td-money.owed { color: var(--danger); font-weight: 600; }
.td-money.neg { color: var(--danger); }
.td-date { color: var(--ink-600); font-variant-numeric: tabular-nums; }
.td-name { line-height: 1.45; white-space: normal; word-break: break-word; }
/* 合计行：原本只有金额格带底纹，中间一格一格是透明的，视觉上像一条
   「断成几截的空白带」；改为整条铺满，并固定在表格底部当作实时合计条 */
.ledger-table tfoot td {
  position: sticky; bottom: 0; z-index: 4;
  background: var(--foot-bg);
  border-top: 1px solid var(--line-2);
  box-shadow: inset 0 1px 0 var(--line);
}
.td-foot { font-weight: 600; color: var(--ink-950); }
.ledger-table tfoot td.td-foot-label {
  left: 0; z-index: 6;
  font-weight: 600; color: var(--ink-600);
  box-shadow: inset 0 1px 0 var(--line), inset -1px 0 0 var(--line);
}
.table-wrap.is-scrolled .ledger-table tfoot td.td-foot-label {
  box-shadow: inset 0 1px 0 var(--line), inset -1px 0 0 var(--line),
              12px 0 14px -12px oklch(21% 0.03 258 / 0.22);
}
.empty-cell {
  text-align: center; color: var(--ink-500); padding: var(--s7) var(--s4) !important;
  font-size: var(--t-sm); line-height: 1.9; background: var(--surface);
}
.empty-cell::before {
  content: "▤"; display: block; margin: 0 auto var(--s3);
  width: 36px; height: 36px; line-height: 34px;
  font-size: 15px; color: var(--ink-400);
  border: 1px solid var(--line-2); border-radius: var(--r2); background: var(--surface-2);
}
.empty-cell b { color: var(--ink-700); font-weight: 600; }
/* 台账空状态用独立面板：这张表宽可达 3000px+，
   <td colspan="N"> 里的居中内容会落在整表中点（可视区之外），等于一片空白 */
.table-wrap.is-empty {
  display: flex; align-items: center; justify-content: center;
  min-height: 220px; padding: var(--s6) var(--s4);
}
.empty-state { text-align: center; max-width: 440px; }
.es-badge {
  display: block; width: 40px; height: 40px; margin: 0 auto var(--s3);
  line-height: 38px; font-size: 17px; color: var(--ink-400);
  border: 1px solid var(--line-2); border-radius: var(--r2); background: var(--surface-2);
}
.es-title { font-size: var(--t-base); font-weight: 600; color: var(--ink-700); }
.es-hint { margin-top: 6px; font-size: var(--t-sm); color: var(--ink-500); line-height: 1.75; }
.table-status {
  display: flex; align-items: baseline; gap: var(--s3);
  margin-top: var(--s2); padding: 0 2px;
  font-size: var(--t-xs); color: var(--ink-500);
}
.table-status .ts-right { margin-left: auto; color: var(--ink-400); }
.table-status b { color: var(--ink-700); font-weight: 600; font-variant-numeric: tabular-nums; }
/* .row-admin 的整行粉色底已移除：斑马行 + 首列竖标记已足够，染色反而形成色块 */
.att-has { color: var(--primary); font-weight: 500; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-block; padding: 1px 8px; border-radius: var(--r-pill);
  font-size: 11.5px; line-height: 1.6; font-weight: 500;
  border: 1px solid transparent; white-space: nowrap;
}
.tag-blue   { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-line); }
.tag-green  { background: var(--ok-soft);      color: var(--ok);      border-color: var(--ok-line); }
.tag-teal   { background: var(--teal-soft);    color: var(--teal);    border-color: oklch(87% 0.05 195); }
.tag-gray   { background: var(--surface-3);    color: var(--ink-600);  border-color: var(--line); }
.tag-red    { background: var(--danger-soft);  color: var(--danger);  border-color: var(--danger-line); }
.tag-orange { background: var(--warn-soft);    color: var(--warn);    border-color: var(--warn-line); }
/* 兼容历史类名（超期预警） */
.tag-settled { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
.tag-overdue { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-line); font-weight: 600; }
.tag-soon    { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.tag-ok      { background: var(--surface-3); color: var(--ink-600); border-color: var(--line); }
.tag-none    { background: transparent; color: var(--ink-500); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: oklch(21% 0.03 258 / 0.42);
  display: flex; align-items: center; justify-content: center;
  padding: var(--s5); animation: mask-in var(--dur) var(--ease);
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r3);
  width: 640px; max-width: 96vw; max-height: 90vh;
  display: flex; flex-direction: column; box-shadow: var(--sh3);
  animation: modal-in var(--dur) var(--ease);
}
@keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(6px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
.modal-sm { width: 400px; }
.modal-lg { width: 780px; }
.modal-xl { width: min(1060px, 96vw); }
.modal-xl .modal-body { max-height: calc(100vh - 200px); overflow-y: auto; }
.modal-header {
  padding: var(--s4) var(--s5); font-size: var(--t-base); font-weight: 600; color: var(--ink-950);
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; gap: var(--s4);
}
.modal-close {
  cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-400);
  width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r1); transition: background var(--dur-f) var(--ease), color var(--dur-f) var(--ease);
}
.modal-close:hover { background: var(--surface-3); color: var(--ink-950); }
.modal-tabs { display: flex; gap: var(--s1); padding: var(--s2) var(--s4) 0; border-bottom: 1px solid var(--line); }
.mtab {
  padding: 8px 15px; border: none; background: transparent; cursor: pointer;
  font-family: var(--font); font-size: var(--t-base); color: var(--ink-500);
  border-bottom: 2px solid transparent; border-radius: var(--r1) var(--r1) 0 0;
  transition: color var(--dur-f) var(--ease), border-color var(--dur-f) var(--ease);
}
.mtab:hover { color: var(--primary); }
.mtab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.modal-body { padding: var(--s4) var(--s5); overflow-y: auto; }
.modal-footer {
  padding: var(--s3) var(--s5); border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: var(--s2); background: var(--surface-2);
  border-radius: 0 0 var(--r3) var(--r3);
}
.confirm-msg { line-height: 1.8; color: var(--ink-700); }

/* ---------- 表单 ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3) var(--s4); }
.form-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.form-full { grid-column: 1 / -1; margin-top: var(--s3); }
.ff-label { font-size: var(--t-xs); color: var(--ink-600); letter-spacing: 0.01em; }
.form-hint { font-size: var(--t-xs); color: var(--ink-500); margin-top: var(--s3); line-height: 1.7; }
.ff-dept { grid-column: 1 / -1; max-width: 320px; }
.form-sec { padding: 2px 0 var(--s4); border-bottom: 1px solid var(--line); }
.form-sec:last-of-type { border-bottom: none; }
.form-sec-title {
  font-size: var(--t-sm); font-weight: 600; color: var(--ink-950);
  margin: var(--s4) 0 var(--s3); display: flex; align-items: center; gap: var(--s2);
}
.form-sec-title::before {
  content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--primary);
  flex-shrink: 0;
}
.form-sec-tag {
  font-size: 11px; font-weight: 400; color: var(--primary);
  background: var(--primary-soft); border: 1px solid var(--primary-line);
  border-radius: var(--r-pill); padding: 1px 8px;
}
.form-sec-tag.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }

/* 锁定字段（部门账号不可编辑） */
.ff-locked .ipt { background: var(--surface-3); color: var(--ink-400); cursor: not-allowed; }
.ff-locked .ff-label { color: var(--ink-400); }
.lock-banner {
  font-size: var(--t-sm); color: oklch(42% 0.10 66);
  background: var(--warn-soft); border: 1px solid var(--warn-line);
  border-left: 3px solid var(--warn);
  border-radius: var(--r2); padding: var(--s2) var(--s3); margin-bottom: var(--s2);
  line-height: 1.7;
}

/* 实时计算条（账内 / 账外 / 余额） */
.calc-bar {
  display: flex; gap: var(--s5); flex-wrap: wrap;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r2); padding: var(--s3) var(--s4); margin-top: var(--s3);
  border-left: 3px solid var(--primary);
}
.calc-bar span {
  font-size: var(--t-xs); color: var(--ink-500);
  display: flex; align-items: baseline; gap: 6px;
}
.calc-bar b {
  font-size: 15px; color: var(--ink-950); font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: 0.005em;
}
.calc-bar i { font-size: 11px; font-style: normal; color: var(--ink-400); }

.editor-error {
  color: var(--danger); background: var(--danger-soft);
  border: 1px solid var(--danger-line); border-left: 3px solid var(--danger);
  border-radius: var(--r2); padding: var(--s2) var(--s3);
  font-size: var(--t-sm); margin-top: var(--s3); line-height: 1.7;
}

/* select + 其他自由填写 */
.sel-free { display: flex; flex-direction: column; gap: 6px; }

/* ---------- 导入 ---------- */
.file-pick {
  border: 1px dashed var(--line-2); border-radius: var(--r3);
  padding: var(--s6) var(--s5); text-align: center; color: var(--ink-500);
  cursor: pointer; margin-bottom: var(--s4);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease),
              color var(--dur) var(--ease);
}
.file-pick:hover, .file-pick.drag {
  border-color: var(--primary); background: var(--primary-soft); color: var(--primary);
}
.file-pick .muted { display: block; margin-top: 4px; }
.fp-icon { font-size: 26px; margin-bottom: var(--s2); color: var(--ink-400); line-height: 1; }
.file-pick:hover .fp-icon, .file-pick.drag .fp-icon { color: var(--primary); }
.import-opts { margin-top: var(--s1); }
.import-step { display: flex; flex-direction: column; }
.import-meta { margin-bottom: var(--s2); font-size: var(--t-base); color: var(--ink-700); }
.import-meta b { color: var(--ink-950); }
.map-wrap { max-height: 320px; }
.map-table th, .map-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.map-table thead th {
  background: var(--thead-bg); font-size: var(--t-xs); color: var(--ink-600);
  position: sticky; top: 0; font-weight: 600;
}
.map-src { font-weight: 500; color: var(--ink-700); }
.map-sample { color: var(--ink-500); font-size: var(--t-xs); }
.map-table tr.map-miss td { background: var(--warn-soft); }
.map-select { width: 100%; padding: 4px 8px; }
.import-done { align-items: center; padding: var(--s5) 0 var(--s2); }
.done-icon {
  width: 52px; height: 52px; border-radius: 50%; font-size: 24px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; margin-bottom: var(--s3);
}
.done-icon.ok { background: var(--ok-soft); color: var(--ok); }
.done-icon.warn { background: var(--warn-soft); color: var(--warn); }
.done-title { font-size: var(--t-lg); font-weight: 600; margin-bottom: var(--s1); color: var(--ink-950); }
.done-stats { margin-bottom: var(--s4); color: var(--ink-600); }
.loading-hint {
  color: var(--ink-500); padding: var(--s5) 0; text-align: center; font-size: var(--t-sm);
}
.loading-hint::after {
  content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 8px;
  vertical-align: -2px; border: 2px solid var(--line-2); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 明细表（开票 / 回款 / 附件） ---------- */
.invoice-summary {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  margin-bottom: var(--s3);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r2);
  padding: var(--s2) var(--s3);
}
.invoice-summary .muted { font-size: var(--t-xs); }
.invoice-table th, .invoice-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left;
}
.invoice-table thead th {
  background: var(--thead-bg); font-size: var(--t-xs); color: var(--ink-600); font-weight: 600;
}
.invoice-table tbody tr:hover td { background: var(--row-hover); }
.invoice-table tbody tr:last-child td { border-bottom: none; }
.invoice-table { font-variant-numeric: tabular-nums; }
.invoice-add { display: flex; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; align-items: center; }
.att-table td, .att-table th { vertical-align: middle; }

/* 附件上传 */
.att-upload { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
.att-progress {
  flex-basis: 100%; height: 5px; background: var(--surface-3);
  border-radius: var(--r-pill); overflow: hidden;
}
.att-progress-bar {
  height: 100%; width: 0; background: var(--primary); border-radius: var(--r-pill);
  transition: width var(--dur) var(--ease);
}
.att-has { color: var(--primary); font-weight: 500; }

/* ---------- 导出汇总表弹窗 ---------- */
.exp-scope {
  display: flex; gap: var(--s5); flex-wrap: wrap; align-items: center;
  font-size: var(--t-sm); color: var(--ink-600);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r2);
  padding: var(--s3); margin-bottom: var(--s3);
}
.exp-scope label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.exp-scope input { accent-color: var(--primary); cursor: pointer; }
.exp-total-row {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--t-sm); color: var(--ink-600);
  margin: var(--s2) 0; cursor: pointer; line-height: 1.7;
}
.exp-total-row input { accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
.exp-total-row:hover { color: var(--primary); }
.exp-fields-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
  margin: var(--s4) 0 var(--s2); padding-bottom: var(--s2);
  border-bottom: 1px solid var(--line);
  font-size: var(--t-sm); font-weight: 600; color: var(--ink-950);
}
.exp-fields-ops { font-size: var(--t-xs); font-weight: 400; color: var(--ink-500); }
.exp-fields-ops a { margin: 0 2px; }
.exp-fields {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 2px var(--s3); max-height: 300px; overflow-y: auto;
  padding: var(--s1) 0;
}
.exp-field {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 4px; border-radius: var(--r1);
  font-size: var(--t-sm); color: var(--ink-700); cursor: pointer;
  transition: background var(--dur-f) var(--ease), color var(--dur-f) var(--ease);
}
.exp-field:hover { background: var(--surface-2); color: var(--primary); }
.exp-field input { accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }

/* ---------- 选项管理 ---------- */
.dict-add-row { display: flex; gap: var(--s2); margin-top: var(--s4); flex-wrap: wrap; }
.dict-add-row .ipt { width: auto; }
.dict-item { font-variant-numeric: tabular-nums; }

/* 勾选框统一配色 */
.row-check, .perm-toggle input, .cp-item input { accent-color: var(--primary); cursor: pointer; }

/* ---------- 明细批量导入 ---------- */
.di-entry {
  margin-top: var(--s3); font-size: var(--t-sm); color: var(--ink-600);
  background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: var(--r2);
  padding: var(--s2) var(--s3);
}
.di-entry a { color: var(--primary); cursor: pointer; font-weight: 600; }
.di-unmatched {
  margin: var(--s2) 0; font-size: var(--t-xs);
  color: oklch(42% 0.10 66); background: var(--warn-soft);
  border: 1px solid var(--warn-line); border-radius: var(--r2);
  padding: 6px 10px; word-break: break-all; line-height: 1.7;
}

/* ---------- 引导 / 设置 ---------- */
.guide-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2);
  padding: var(--s5) var(--s5) var(--s4); box-shadow: var(--sh1);
}
.guide-steps { padding-left: var(--s5); line-height: 2; margin-bottom: var(--s4); color: var(--ink-600); }
.guide-steps li::marker { color: var(--ink-400); font-variant-numeric: tabular-nums; }
.guide-steps b { color: var(--ink-950); }
.settings-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2);
  padding: var(--s5); box-shadow: var(--sh1); max-width: 540px;
  display: flex; flex-direction: column; gap: var(--s4);
}
/* 设置页：信息卡网格 + 键值行 */
.settings-grid {
  display: grid; gap: var(--s4); align-items: start;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}
.settings-grid .settings-card { max-width: none; gap: var(--s3); }
.set-title {
  font-size: var(--t-base); font-weight: 600; color: var(--ink-950);
  padding-bottom: var(--s2); border-bottom: 1px solid var(--line);
}
.set-list { display: flex; flex-direction: column; }
.set-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: var(--s4); padding: 7px 0; border-bottom: 1px dashed var(--line);
  font-size: var(--t-sm);
}
.set-row:last-child { border-bottom: 0; }
.set-k { color: var(--ink-500); flex: none; }
.set-v { color: var(--ink-950); font-weight: 500; text-align: right; word-break: break-all; }
.set-hint { font-size: var(--t-xs); color: var(--ink-500); line-height: 1.8; margin: 0; }

/* 用户管理：权限表读取异常的可视化提示（避免静默显示成"没有权限"） */
.admin-warn {
  margin-bottom: var(--s3); padding: 10px var(--s3);
  font-size: var(--t-xs); line-height: 1.7; word-break: break-all;
  color: oklch(42% 0.10 66); background: var(--warn-soft);
  border: 1px solid var(--warn-line); border-radius: var(--r2);
}

/* ---------- 用户 / 批次管理表格 ---------- */
.batch-table th, .batch-table td, .admin-table th, .admin-table td {
  padding: 8px var(--s3); border-bottom: 1px solid var(--line); text-align: left;
}
.batch-table thead th, .admin-table thead th {
  background: var(--thead-bg); font-size: var(--t-xs); color: var(--ink-600);
  font-weight: 600; position: sticky; top: 0; z-index: 5;
  border-bottom: 1px solid var(--line-2);
}
.batch-table tbody tr, .admin-table tbody tr { --row-bg: var(--surface); }
.batch-table tbody tr:nth-child(even), .admin-table tbody tr:nth-child(even) { --row-bg: var(--row-alt); }
/* 行悬浮必须落在 td 上——td 自带不透明底色，染 tr 是看不见的 */
.batch-table tbody tr:hover td, .admin-table tbody tr:hover td { background: var(--row-hover); }
.batch-table tbody td, .admin-table tbody td { background: var(--row-bg); vertical-align: middle; }

/* 用户表：固定列宽（列宽写死在 colgroup 上，表头与表体永不漂移） */
.admin-table { table-layout: fixed; }
/* 横向内边距收到 8px：与台账主表一致，也给「台账权限」列腾出勾选网格的宽度 */
.admin-table th, .admin-table td { padding-left: 8px; padding-right: 8px; }
.admin-table col.c-user  { width: 168px; }
.admin-table col.c-mail  { width: 156px; }
.admin-table col.c-dept  { width: 120px; }
.admin-table col.c-phone { width: 108px; }
.admin-table col.c-role  { width: 100px; }
.admin-table col.c-act   { width: 104px; }
/* 单行省略：固定布局下超长内容会压到邻列，必须裁掉 */
.admin-table td.cell-ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-table td.cell-name { white-space: normal; line-height: 1.45; }
.admin-table tbody td:last-child a + a { margin-left: 12px; }
/* 受保护的主管理员：整行染色会在单元格之间断成色块，改用首列一道竖标记 */
.admin-table tbody tr.row-admin td:first-child { box-shadow: inset 2px 0 0 var(--primary-line); }

/* 台账权限列：CSS Grid 对齐（绝不可给 td 直接 display:flex，会退出表格布局） */
.perm-cell {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 3px 10px; align-items: center;
}
.perm-toggle {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0;
  font-size: var(--t-xs); color: var(--ink-600); cursor: pointer; white-space: nowrap;
}
.perm-toggle:hover { color: var(--primary); }
.perm-toggle input { accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
.perm-foot {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2); margin-top: 2px; padding-top: 5px; border-top: 1px dashed var(--line);
}
.perm-state { font-size: 11.5px; color: var(--ink-500); }
.perm-cell.is-dirty .perm-state { color: var(--warn); font-weight: 500; }
.perm-save {
  font-family: var(--font); font-size: var(--t-xs); line-height: 1; padding: 4px 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-600);
  border-radius: var(--r1); cursor: pointer;
  transition: border-color var(--dur-f) var(--ease), color var(--dur-f) var(--ease),
              background var(--dur-f) var(--ease);
}
.perm-save:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.perm-cell.is-dirty .perm-save { background: var(--primary); border-color: var(--primary); color: var(--surface); }
.perm-cell.is-dirty .perm-save:hover:not(:disabled) { background: var(--primary-600); color: var(--surface); }
.perm-save:disabled { opacity: 0.5; cursor: default; }
.perm-full { font-size: var(--t-xs); color: var(--ink-500); }
.act-none { font-size: var(--t-xs); color: var(--ink-400); }
.lock-chip {
  display: inline-block; padding: 0 6px; border-radius: var(--r-pill);
  font-size: 11px; line-height: 1.6; color: var(--ink-500);
  background: var(--surface-3); border: 1px solid var(--line);
}

/* 密码强度条 */
.pwd-meter { height: 5px; background: var(--surface-3); border-radius: var(--r-pill); overflow: hidden; margin-top: var(--s2); }
.pwd-meter-bar { height: 100%; width: 0; background: var(--line-2); border-radius: var(--r-pill); transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }
.pwd-hint { font-size: 11.5px; color: var(--ink-500); margin-top: var(--s1); min-height: 16px; }
.pwd-hint.ok { color: var(--ok); }

/* ---------- 部门管理（卡片网格） ---------- */
.dept-panel {
  margin-top: var(--s4); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--sh1); padding: var(--s4) var(--s4) var(--s5);
}
.dept-panel-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s4);
  flex-wrap: wrap; margin-bottom: var(--s4); padding-bottom: var(--s3);
  border-bottom: 1px solid var(--line);
}
.dph-title { font-size: var(--t-base); font-weight: 600; color: var(--ink-950); margin-bottom: 3px; }
.dph-sub { font-size: var(--t-xs); color: var(--ink-500); line-height: 1.7; }
.dept-add { display: flex; gap: var(--s2); }
.dept-add .ipt { width: 210px; }

.dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: var(--s2); }
.dept-card {
  position: relative; border: 1px solid var(--line); border-radius: var(--r2);
  padding: 10px var(--s3); background: var(--surface);
  min-height: 62px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  transition: border-color var(--dur-f) var(--ease), background var(--dur-f) var(--ease),
              box-shadow var(--dur-f) var(--ease);
}
.dept-card:hover {
  border-color: var(--primary); background: var(--surface);
  box-shadow: 0 2px 10px oklch(45% 0.13 258 / 0.10);
}
.dc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
.dc-name {
  font-size: var(--t-sm); font-weight: 600; color: var(--ink-950); line-height: 1.45;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dc-count {
  flex-shrink: 0; min-width: 24px; text-align: center; font-size: 11.5px;
  color: var(--primary); background: var(--primary-soft);
  border: 1px solid var(--primary-line);
  border-radius: var(--r-pill); padding: 0 7px; font-variant-numeric: tabular-nums;
}
.dc-count.zero { color: var(--ink-500); background: var(--surface-3); border-color: var(--line); }
.dc-acts {
  display: flex; gap: var(--s1); justify-content: flex-end;
  opacity: 0; transition: opacity var(--dur-f) var(--ease);
}
.dept-card:hover .dc-acts, .dept-card:focus-within .dc-acts { opacity: 1; }
.dc-btn {
  min-width: 34px; height: 22px; padding: 0 6px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r1); font-size: 11.5px; line-height: 1; color: var(--ink-600);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font);
  transition: border-color var(--dur-f) var(--ease), color var(--dur-f) var(--ease),
              background var(--dur-f) var(--ease);
}
.dc-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.dc-btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.dc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.dept-empty {
  grid-column: 1 / -1; text-align: center; color: var(--ink-500); font-size: var(--t-sm);
  padding: var(--s5) 0; border: 1px dashed var(--line-2); border-radius: var(--r2);
  background: var(--surface-2);
}

/* 旧版纯文本部门芯片（保留兼容） */
.dept-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1px solid var(--line); border-radius: var(--r-pill);
  background: var(--surface); font-size: var(--t-xs); color: var(--ink-700);
}
.dept-chip a { font-size: 11px; }

/* ---------- 列设置面板（按账号保存） ---------- */
.col-panel {
  position: absolute; z-index: 60; width: 272px; background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--r3);
  box-shadow: var(--sh2); overflow: hidden;
}
.cp-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2);
  padding: 9px var(--s3); border-bottom: 1px solid var(--line);
  font-size: var(--t-sm); font-weight: 600; color: var(--ink-950); background: var(--surface-2);
}
.cp-tip { font-size: 11.5px; color: var(--ink-500); font-weight: 400; }
.cp-list { max-height: 320px; overflow-y: auto; padding: var(--s2) var(--s3); }
.cp-item {
  display: flex; align-items: center; gap: 7px; padding: 3.5px 0;
  font-size: var(--t-sm); color: var(--ink-700); cursor: pointer; white-space: nowrap;
}
.cp-item:hover { color: var(--primary); }
.cp-item input { accent-color: var(--primary); cursor: pointer; }
.cp-foot {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3);
  border-top: 1px solid var(--line); background: var(--surface-2); font-size: var(--t-xs);
}
.cp-foot a { font-size: var(--t-xs); }
.cp-dbstate { margin-left: auto; color: var(--ok); font-size: 11.5px; }
.cp-dbstate.warn { color: var(--warn); }

/* ---------- Toast ---------- */
#toast-box {
  position: fixed; top: var(--s5); left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column; gap: var(--s2); align-items: center;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: var(--s2);
  padding: 9px var(--s4) 9px var(--s3);
  border-radius: var(--r2); font-size: var(--t-base);
  background: var(--ink-900); color: var(--ink-100);
  border: 1px solid oklch(35% 0.02 258);
  border-left: 3px solid var(--ink-500);
  box-shadow: var(--sh2);
  opacity: 0; transform: translateY(-8px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  max-width: min(560px, 90vw); line-height: 1.6;
}
.toast.show { opacity: 1; transform: none; }
.toast-info { border-left-color: oklch(68% 0.03 258); }
.toast-success { border-left-color: oklch(70% 0.14 152); }
.toast-error { border-left-color: oklch(65% 0.17 28); }

.boot-error { padding: var(--s7); text-align: center; color: var(--danger); font-size: var(--t-base); }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: oklch(82% 0.012 258); border-radius: var(--r-pill);
  border: 3px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: oklch(70% 0.015 258); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }

/* ---------- 数据看板 ---------- */
.dash-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); margin-bottom: var(--s3); }
.kpi-card {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--sh1);
  padding: var(--s4) var(--s4) var(--s3);
}
.kpi-card::before {
  content: ""; position: absolute; left: 0; top: var(--s4); bottom: var(--s4);
  width: 3px; border-radius: 0 3px 3px 0; background: var(--line-2);
}
.kpi-label {
  font-size: var(--t-xs); color: var(--ink-500); letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 5px;
}
.kpi-value {
  font-size: var(--t-2xl); font-weight: 600; color: var(--ink-950);
  margin-top: var(--s2); letter-spacing: -0.02em; line-height: 1.15;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;            /* 金额数字不折行（折行会破坏 KPI 行基线） */
}
.kpi-value .kpi-unit { font-size: var(--t-sm); font-weight: 500; margin-left: 3px; color: var(--ink-500); }
.kpi-value .kpi-sep { font-size: var(--t-lg); color: var(--ink-300); margin: 0 6px; font-weight: 400; }
.kpi-sub { font-size: 11.5px; color: var(--ink-500); margin-top: var(--s2); line-height: 1.6; }
.kpi-blue::before { background: var(--primary); }
.kpi-blue .kpi-value { color: var(--primary); }
.kpi-danger::before { background: var(--danger); }
.kpi-danger .kpi-value { color: var(--danger); }

.dash-grid { display: grid; grid-template-columns: 3fr 2fr; gap: var(--s3); margin-bottom: var(--s3); }
.dash-grid.even { grid-template-columns: 1fr 1fr; }
.dash-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--sh1); margin-bottom: var(--s3);
}
.dash-grid .dash-card { margin-bottom: 0; }
.dash-card-head {
  display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line);
}
.dash-card-head h3 { font-size: var(--t-sm); font-weight: 600; color: var(--ink-950); }
.dash-card-head .muted { flex: 1; min-width: 120px; text-align: right; }
.dash-card-body { padding: var(--s4); }
/* 图表：SVG 宽度 = 容器实测宽度（缩放比 1，图内文字即设计字号），故此处不再干预尺寸 */
.dash-card-body svg { display: block; }
.dash-card-body [data-chart] + [data-chart] { margin-top: var(--s1); }
.dash-empty-sm {
  padding: var(--s5) var(--s4); text-align: center; color: var(--ink-500);
  font-size: var(--t-sm); line-height: 1.9;
}
.dash-empty {
  background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r3);
  padding: var(--s7) var(--s5); text-align: center; font-size: var(--t-base); color: var(--ink-600);
}
.dash-legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin-top: var(--s3); }
.dash-legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--t-xs); color: var(--ink-500);
}
.dash-legend-item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
.dash-legend-item b { color: var(--ink-950); font-weight: 600; font-variant-numeric: tabular-nums; }
.dash-table { font-size: var(--t-xs); }
.dash-table th { position: sticky; top: 0; }
.dash-table td, .dash-table th { padding: 6px 8px; }

/* 汉堡按钮（仅移动端显示） */
.menu-btn {
  display: none; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex-shrink: 0;
  border: 1px solid var(--line-2); border-radius: var(--r2);
  background: var(--surface); font-size: 15px; line-height: 1; cursor: pointer; color: var(--ink-700);
}
.menu-btn:hover { border-color: var(--primary); color: var(--primary); }
.sidebar-mask { display: none; }

/* ==========================================================================
   ⑤ 响应式
   ========================================================================== */
@media (max-width: 1100px) {
  .dash-kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .sidebar { width: 60px; }
  .side-brand { font-size: 10px; padding: var(--s3) 6px; letter-spacing: 0; text-align: center; }
  .nav-item { justify-content: center; padding: 9px 0; }
  .nav-item span:not(.nav-icon) { display: none; }
  .side-perms { display: none; }
  .form-grid { grid-template-columns: 1fr; }
  .dash-grid, .dash-grid.even { grid-template-columns: 1fr; }
  .table-wrap { max-height: none; }
}
@media (max-width: 680px) {
  .menu-btn { display: inline-flex; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 60; width: 210px;
    transform: translateX(-100%); transition: transform var(--dur) var(--ease);
  }
  .sidebar.open { transform: translateX(0); box-shadow: var(--sh3); }
  .sidebar .nav-item { justify-content: flex-start; padding: 9px var(--s3); }
  .sidebar .nav-item span:not(.nav-icon) { display: inline; }
  .sidebar .side-perms { display: block; }
  .sidebar-mask.show { display: block; position: fixed; inset: 0; background: oklch(21% 0.03 258 / 0.45); z-index: 55; }
  .topbar { padding: 0 var(--s3); }
  .topbar-user .user-dept { display: none; }
  .page-container { padding: var(--s3) var(--s3) var(--s6); }
  .dash-kpis { grid-template-columns: 1fr; }
  .toolbar { align-items: stretch; }
  .kw-input { width: 100%; }
  .invoice-add { align-items: stretch; }
  .modal-xl { width: 100vw; }
  .calc-bar { gap: var(--s3); }
  /* 小屏不冻结列，避免可用宽度被吃掉 */
  .ledger-table th.col-check, .ledger-table td.col-check,
  .ledger-table th.col-idx, .ledger-table td.col-idx,
  .ledger-table th.col-actions, .ledger-table td.col-actions,
  .ledger-table tfoot td, .td-foot-label { position: static; box-shadow: none; }
  #page-ledger .table-wrap { min-height: 0; }
}
@media (max-width: 460px) {
  .topbar-user .user-name { display: none; }
}

/* ==========================================================================
   ⑥ 打印（财务常把汇总表打出来或存 PDF）
   ========================================================================== */
@media print {
  @page { margin: 12mm; }
  body { background: #fff; font-size: 10.5pt; }
  .sidebar, .sidebar-mask, .topbar, .toolbar, .capsule-row, .menu-btn,
  .col-check, .col-actions, .table-status, #toast-box, .dash-kpis .kpi-card::before { display: none !important; }
  .app-shell { display: block; }
  .page-container { padding: 0; }
  .hidden { display: none !important; }
  .table-wrap, .dash-card, .guide-card, .dept-panel {
    max-height: none !important; overflow: visible !important;
    border-color: #bbb; box-shadow: none; break-inside: auto;
  }
  .ledger-table thead { display: table-header-group; }
  .ledger-table thead th { position: static; box-shadow: none; background: #f2f4f7; }
  /* 纸上没有冻结列这回事，全部退回普通流 */
  .ledger-table th.col-idx, .ledger-table td.col-idx,
  .ledger-table tfoot td, .td-foot-label { position: static; box-shadow: none; }
  .ledger-table tbody tr, .dash-table tr { break-inside: avoid; }
  .ledger-table td, .ledger-table th { border-color: #ccc; }
  /* 用户表：纸上没有横向滚动，退回自动列宽并允许换行，避免账号/部门被省略号吃掉 */
  .admin-table { table-layout: auto; }
  .admin-table td.cell-ell { white-space: normal; overflow: visible; text-overflow: clip; }
  .ledger-table th.col-check, .ledger-table td.col-check,
  .ledger-table th.col-idx, .ledger-table td.col-idx { position: static; box-shadow: none; }
  .td-foot-label { position: static; box-shadow: none; }
  a { color: inherit; text-decoration: none; }
}

/* ==========================================================================
   ⑦ 动效偏好
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* —— 预览页专属：仅用于说明，不属于产品样式 —— */
.preview-note {
  position: sticky; top: 0; z-index: 99;
  padding: 7px 16px; font-size: 12px; line-height: 1.6;
  background: oklch(96% 0.03 258); color: oklch(38% 0.09 258);
  border-bottom: 1px solid oklch(86% 0.065 258);
}
.preview-note b { font-weight: 600; }
</style>
</head>
<body>
<div class="preview-note">
  <b>看板视觉预览</b> · 数据为模拟数据（不连数据库、不发请求）· 内容与真实系统同源：
  <code>css/style.css</code> + <code>js/dashboard.js</code> ·
  <b>拖动浏览器窗口改变宽度，图表内文字应保持同一大小</b>（本次修复的正是这一点）
</div>
<div id="root"></div>
<script>/**
 * fields.js - 台账字段定义（新指标体系 v3，依据《应收系统统计指标.xlsx》28 列）
 *
 * 台账表格 / 编辑表单 / Excel 导入映射 / 导出 共用。
 *

<script>/**
 * utils.js - 通用工具（格式化 / DOM / 提示 / 确认框 / 防抖）
 */

const Utils = {

  /** HTML 转义 */
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  /** 金额格式化：千分位，最多 2 位小数（整数不带小数点） */
  fmtMoney(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    if (!isFinite(n)) return String(v);
    const fixed = Math.abs(n) >= 1000 ? n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : String(Math.round(n * 100) / 100);
    return fixed;
  },

  /** 解析金额输入/Excel 单元格（支持千分位、字符串） */
  parseMoney(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(/[,\s￥¥]/g, '').replace(/[（）()]/g, m => m === '（' || m === '(' ? '-' : '');
    const n = Number(s);
    return isFinite(n) && s !== '' ? n : null;
  },

  /** 日期格式化 YYYY-MM-DD */
  fmtDate(v) {
    if (!v) return '';
    if (typeof v === 'string') {
      const m = v.match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
      const d = new Date(v);
      return isNaN(d) ? v.slice(0, 10) : d.toISOString().slice(0, 10);
    }
    return '';
  },

  /**
   * Excel 日期值 -> YYYY-MM-DD
   * SheetJS cellDates 模式给 Date 对象；数字为 Excel 序列号
   */
  parseExcelDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) {
      return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
    }
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      // Excel 序列号（1900 日期系统）
      const d = new Date(Math.round((v - 25569) * 86400 * 1000));
      return d.toISOString().slice(0, 10);
    }
    const s = String(v).trim();
    if (!s) return null;
    const m = s.match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/);
    if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
    const d = new Date(s);
    if (!isNaN(d) && d.getFullYear() > 1990) return d.toISOString().slice(0, 10);
    return null;
  },

  /**
   * 项目名称等长文本截断：≤3 行 × 每行 12 个汉字，超出以 … 结尾
   */
  clampName(str, maxLine = 12, maxLineCount = 3) {
    const s = String(str || '');
    if (!s) return '';
    const limit = maxLine * maxLineCount;
    if (s.length <= limit) return s;
    return s.slice(0, limit) + '…';
  },

  /** 防抖 */
  debounce(fn, wait = 300) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  },

  /** 轻提示 */
  toast(msg, type = 'info') {
    let box = document.getElementById('toast-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toast-box';
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.classList.add('show'); }, 10);
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, type === 'error' ? 4200 : 2600);
  },

  /**
   * 确认框（Promise<boolean>）
   * @param {string} message 支持 \n 换行
   * @param {object} opts { title, danger, confirmText }
   */
  confirm(message, opts = {}) {
    return new Promise(resolve => {
      const old = document.getElementById('modal-confirm');
      if (old) old.remove();
      const el = document.createElement('div');
      el.id = 'modal-confirm';
      el.className = 'modal-mask';
      el.innerHTML = `
        <div class="modal modal-sm">
          <div class="modal-header">${Utils.escapeHtml(opts.title || '请确认')}</div>
          <div class="modal-body confirm-msg">${Utils.escapeHtml(message).replace(/\n/g, '<br>')}</div>
          <div class="modal-footer">
            <button class="btn" data-act="cancel">取消</button>
            <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${Utils.escapeHtml(opts.confirmText || '确定')}</button>
          </div>
        </div>`;
      document.body.appendChild(el);
      let sx = 0, sy = 0;
      el.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; });
      el.addEventListener('click', e => {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) return;
        if (e.target === el || e.target.closest('[data-act="cancel"]')) { el.remove(); resolve(false); }
        else if (e.target.closest('[data-act="ok"]')) { el.remove(); resolve(true); }
      });
    });
  },

  /**
   * 弹窗遮罩点击关闭（带拖拽误触保护：按下滑动超 6px 不关闭）
   * @param {HTMLElement} mask 遮罩元素
   * @param {Function} onClose 点击遮罩关闭时回调
   */
  bindMaskClose(mask, onClose) {
    let sx = 0, sy = 0;
    mask.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; });
    mask.addEventListener('click', e => {
      if (e.target !== mask) return;
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) return;
      onClose();
    });
  },

  /** 密码强度评分（0-5）：长度≥8 / 大写 / 小写 / 数字 / 符号 各计 1 分 */
  pwdScore(v) {
    if (!v) return 0;
    let s = 0;
    if (v.length >= 8) s++;
    if (/[A-Z]/.test(v)) s++;
    if (/[a-z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    return s;
  },

  /** 密码是否符合强密码规则（≥8 位 + 四类字符） */
  pwdValid(v) { return this.pwdScore(v) >= 5; },

  /** 给密码输入框绑定实时强度进度条（bar 进度条元素，hint 提示元素） */
  bindPwdMeter(input, bar, hint) {
    /* 色阶与设计令牌同源（oklch → sRGB）：灰 → 朱砂 → 琥珀 → 橄榄 → 绿 */
    const colors = ['#e0e3e8', '#a74639', '#975800', '#756c00', '#53760e', '#137d41'];
    const update = () => {
      const v = input.value;
      const s = this.pwdScore(v);
      const ok = this.pwdValid(v);
      bar.style.width = (v ? Math.max(s / 5 * 100, 8) : 0) + '%';
      bar.style.background = v ? colors[s] : colors[0];
      if (!v) {
        hint.textContent = '至少 8 位，须同时包含大写字母、小写字母、数字和符号';
        hint.classList.remove('ok');
        return;
      }
      const missing = [];
      if (v.length < 8) missing.push('至少 8 位');
      if (!/[A-Z]/.test(v)) missing.push('大写字母');
      if (!/[a-z]/.test(v)) missing.push('小写字母');
      if (!/[0-9]/.test(v)) missing.push('数字');
      if (!/[^A-Za-z0-9]/.test(v)) missing.push('符号');
      hint.textContent = ok ? '✓ 密码强度合格' : '还缺：' + missing.join('、');
      hint.classList.toggle('ok', ok);
    };
    input.addEventListener('input', update);
    update();
  },

  /** 计算两个日期相差天数（b - a） */
  daysBetween(a, b) {
    if (!a || !b) return null;
    const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
    if (isNaN(da) || isNaN(db)) return null;
    return Math.round((db - da) / 86400000);
  },

  /** 今天 YYYY-MM-DD */
  today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },

  /**
   * 说明（2026-09-15）：原 `overdueStatus()`（按完工日期 + 预警天数自动判定超期）
   * 已删除。它引用的 receivable_total / end_date 是 v3 已废弃字段，且按
   * CONTEXT.md / ADR-0002 的结论——本院"按合同期限几乎全部逾期"、自动判定无区分度，
   * 债权状态改为人工维护（「债权状态」下拉）。系统不做自动逾期判定。
   */
};
