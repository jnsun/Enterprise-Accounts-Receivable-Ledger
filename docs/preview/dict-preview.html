const Dicts = {

  cache: {},        // category -> [value, ...]（仅存 ar_dict 中实际存在的）
  dbOk: false,      // ar_dict 表是否可用

  /** 登录后调用：加载全部字典 */
  async load() {
    this.cache = {};
    this.dbOk = false;
    try {
      const { data, error } = await sb.from('ar_dict')
        .select('category, value').order('category').order('sort_order').limit(2000);
      if (!error && data) {
        this.dbOk = true;
        data.forEach(d => {
          (this.cache[d.category] = this.cache[d.category] || []).push(d.value);
        });
      }
    } catch (e) { /* 表未建等情况，静默降级 */ }
  },

  /** 某类别的选项列表（数据库优先，空则用内置默认） */
  get(category) {
    const list = this.cache[category];
    if (list && list.length) return list;
    return DICT_BUILTIN[category] || [];
  },

  /** 类别是否在数据库中有维护（「选项管理」页区分内置/自定义） */
  isManaged(category) {
    return !!(this.cache[category] && this.cache[category].length);
  },
};
</script>
<script>/**
 * utils.js - 通用工具（格式化 / DOM / 提示 / 确认框 / 防抖）
 */

const Utils = {

  /** HTML 转义 */
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  /** 金额格式化：千分位，最多 2 位小数（整数不带小数点） */
  fmtMoney(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    if (!isFinite(n)) return String(v);
    const fixed = Math.abs(n) >= 1000 ? n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : String(Math.round(n * 100) / 100);
    return fixed;
  },

  /** 解析金额输入/Excel 单元格（支持千分位、字符串） */
  parseMoney(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(/[,\s￥¥]/g, '').replace(/[（）()]/g, m => m === '（' || m === '(' ? '-' : '');
    const n = Number(s);
    return isFinite(n) && s !== '' ? n : null;
  },

  /** 日期格式化 YYYY-MM-DD */
  fmtDate(v) {
    if (!v) return '';
    if (typeof v === 'string') {
      const m = v.match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
      const d = new Date(v);
      return isNaN(d) ? v.slice(0, 10) : d.toISOString().slice(0, 10);
    }
    return '';
  },

  /**
   * Excel 日期值 -> YYYY-MM-DD
   * SheetJS cellDates 模式给 Date 对象；数字为 Excel 序列号
   */
  parseExcelDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) {
      return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
    }
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      // Excel 序列号（1900 日期系统）
      const d = new Date(Math.round((v - 25569) * 86400 * 1000));
      return d.toISOString().slice(0, 10);
    }
    const s = String(v).trim();
    if (!s) return null;
    const m = s.match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/);
    if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
    const d = new Date(s);
    if (!isNaN(d) && d.getFullYear() > 1990) return d.toISOString().slice(0, 10);
    return null;
  },

  /**
   * 项目名称等长文本截断：≤3 行 × 每行 12 个汉字，超出以 … 结尾
   */
  clampName(str, maxLine = 12, maxLineCount = 3) {
    const s = String(str || '');
    if (!s) return '';
    const limit = maxLine * maxLineCount;
    if (s.length <= limit) return s;
    return s.slice(0, limit) + '…';
  },

  /** 防抖 */
  debounce(fn, wait = 300) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  },

  /** 轻提示 */
  toast(msg, type = 'info') {
    let box = document.getElementById('toast-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toast-box';
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.classList.add('show'); }, 10);
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, type === 'error' ? 4200 : 2600);
  },

  /**
   * 确认框（Promise<boolean>）
   * @param {string} message 支持 \n 换行
   * @param {object} opts { title, danger, confirmText }
   */
  confirm(message, opts = {}) {
    return new Promise(resolve => {
      const old = document.getElementById('modal-confirm');
      if (old) old.remove();
      const el = document.createElement('div');
      el.id = 'modal-confirm';
      el.className = 'modal-mask';
      el.innerHTML = `
        <div class="modal modal-sm">
          <div class="modal-header">${Utils.escapeHtml(opts.title || '请确认')}</div>
          <div class="modal-body confirm-msg">${Utils.escapeHtml(message).replace(/\n/g, '<br>')}</div>
          <div class="modal-footer">
            <button class="btn" data-act="cancel">取消</button>
            <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${Utils.escapeHtml(opts.confirmText || '确定')}</button>
          </div>
        </div>`;
      document.body.appendChild(el);
      let sx = 0, sy = 0;
      el.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; });
      el.addEventListener('click', e => {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) return;
        if (e.target === el || e.target.closest('[data-act="cancel"]')) { el.remove(); resolve(false); }
        else if (e.target.closest('[data-act="ok"]')) { el.remove(); resolve(true); }
      });
    });
  },

  /**
   * 弹窗遮罩点击关闭（带拖拽误触保护：按下滑动超 6px 不关闭）
   * @param {HTMLElement} mask 遮罩元素
   * @param {Function} onClose 点击遮罩关闭时回调
   */
  bindMaskClose(mask, onClose) {
    let sx = 0, sy = 0;
    mask.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; });
    mask.addEventListener('click', e => {
      if (e.target !== mask) return;
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) return;
      onClose();
    });
  },

  /** 密码强度评分（0-5）：长度≥8 / 大写 / 小写 / 数字 / 符号 各计 1 分 */
  pwdScore(v) {
    if (!v) return 0;
    let s = 0;
    if (v.length >= 8) s++;
    if (/[A-Z]/.test(v)) s++;
    if (/[a-z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    return s;
  },

  /** 密码是否符合强密码规则（≥8 位 + 四类字符） */
  pwdValid(v) { return this.pwdScore(v) >= 5; },

  /** 给密码输入框绑定实时强度进度条（bar 进度条元素，hint 提示元素） */
  bindPwdMeter(input, bar, hint) {
    /* 色阶与设计令牌同源（oklch → sRGB）：灰 → 朱砂 → 琥珀 → 橄榄 → 绿 */
    const colors = ['#e0e3e8', '#a74639', '#975800', '#756c00', '#53760e', '#137d41'];
    const update = () => {
      const v = input.value;
      const s = this.pwdScore(v);
      const ok = this.pwdValid(v);
      bar.style.width = (v ? Math.max(s / 5 * 100, 8) : 0) + '%';
      bar.style.background = v ? colors[s] : colors[0];
      if (!v) {
        hint.textContent = '至少 8 位，须同时包含大写字母、小写字母、数字和符号';
        hint.classList.remove('ok');
        return;
      }
      const missing = [];
      if (v.length < 8) missing.push('至少 8 位');
      if (!/[A-Z]/.test(v)) missing.push('大写字母');
      if (!/[a-z]/.test(v)) missing.push('小写字母');
      if (!/[0-9]/.test(v)) missing.push('数字');
      if (!/[^A-Za-z0-9]/.test(v)) missing.push('符号');
      hint.textContent = ok ? '✓ 密码强度合格' : '还缺：' + missing.join('、');
      hint.classList.toggle('ok', ok);
    };
    input.addEventListener('input', update);
    update();
  },

  /** 计算两个日期相差天数（b - a） */
  daysBetween(a, b) {
    if (!a || !b) return null;
    const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
    if (isNaN(da) || isNaN(db)) return null;
    return Math.round((db - da) / 86400000);
  },

  /** 今天 YYYY-MM-DD */
  today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },

  /**
   * 说明（2026-09-15）：原 `overdueStatus()`（按完工日期 + 预警天数自动判定超期）
   * 已删除。它引用的 receivable_total / end_date 是 v3 已废弃字段，且按
   * CONTEXT.md / ADR-0002 的结论——本院"按合同期限几乎全部逾期"、自动判定无区分度，
   * 债权状态改为人工维护（「债权状态」下拉）。系统不做自动逾期判定。
   */
};
</script>
<script>/**
 * dictadmin.js - 选项管理页（要求三：蓝色内置可选项，财务可自行编辑）
 *
 * 管理表单下拉选项（ar_dict）：增删改、上下排序。
 * 保存方式：整类重写（先删后插），保证顺序即 sort_order。
 * 类别为空时以内置默认选项作为初始内容，保存后即入库生效。
 *
 * 版面：双栏面板 —— 左栏类别索引（类别名 + 项数 + 是否已自定义），
 *       右栏当前类别的选项编辑区。样式见 css/style.css「选项管理」段。
 *
 * ── 与台账数据的一致性（「在用」列与孤儿值）──────────────────────────────
 * 选项表不是孤岛：删掉一个还在被台账引用的选项，那些记录里的值不会跟着变，
 * 只会变成「数据里有、选项表里没有」的孤儿值 —— 从此筛不出来、编辑时也选不回。
 * 所以这里反查台账，把三件事摆到台面上：
 *   ① 「在用」列：每个选项当前被多少条记录引用（0 = 从未使用）
 *   ② 底部一致性卡片：数据里在用、选项表里没有的值，可一键「加入选项」
 *   ③ 删除 / 保存**之前**确认影响面，而不是保存完才发现筛不出来了
 * 读不到台账（无权限、断网、表不存在）时一律降级为「不显示使用情况」，不影响编辑与保存。
 * 条数是全量口径：本页只对管理员开放（Auth.isAdmin），而 ar_ledger 的 RLS 里
 * ar_is_admin() 成立即 ar_can_see_row() 恒真，所以管理员看到的就是全部部门的记录。
 */

const DictAdmin = {

  current: null,   // 当前类别 key
  items: [],       // 当前类别的选项值（有序）
  dirty: false,

  usage: null,     // Map<值, 引用条数>；null = 读不到台账（降级：不显示使用情况）
  usageMax: 0,     // 上者中的最大条数（细条的归一基准；缓存起来避免每次渲染都遍历 Map）
  loadedVals: [],  // 本次打开时数据库里的值（用于分辨「原本是选项」vs「数据里冒出来的新值」）
  usageSrc: null,  // 当前类别的数据来源 {table, col, unit}

  async load(catKey) {
    const page = document.getElementById('page-dict');
    if (!page) return;
    if (!Auth.isAdmin) {
      page.innerHTML = `
        <div class="page-head"><h2>选项管理</h2></div>
        <div class="guide-card"><p class="muted">只有财务管理员可以维护选项。</p></div>`;
      return;
    }
    if (!this.current) this.current = catKey || DICT_CATEGORIES[0].key;

    // 读取数据库实际值；类别未维护时用内置默认值作为起点
    const { data, error } = await sb.from('ar_dict')
      .select('value').eq('category', this.current).order('sort_order');
    if (error) { Utils.toast('选项加载失败：' + error.message, 'error'); return; }
    this.items = (data || []).map(d => d.value);
    this.loadedVals = [...this.items];     // 快照：用于分辨「原本是选项」与「数据里冒出来的值」
    if (!this.items.length) this.items = [...Dicts.get(this.current)];
    this.dirty = false;
    await this.loadUsage();                // 反查台账引用情况（读不到则为 null，界面自动降级）
    this.render();
  },

  /* ================= 与台账数据的一致性 ================= */

  /** 类别 → 它在业务数据里的落点。多数类别是 ar_ledger 上的一列，字段名由 FIELD_DEFS 的
   *  dict 反查（不在这里再抄一份映射，否则加字段时两处要同时改）；
   *  附件类别落在 ar_attachments.category，不是台账字段，单独列出。 */
  sourceOf(cat) {
    if (cat === 'attach_category') {
      return { table: 'ar_attachments', col: 'category', unit: '份附件', where: '附件的「类别」' };
    }
    const f = FIELD_DEFS.find(x => x.dict === cat);
    if (!f) return null;
    return { table: 'ar_ledger', col: f.key, unit: '条台账', where: `台账的「${f.label}」列` };
  },

  /** 统计每个选项被多少条记录引用。
   *  读不到（无权限 / 断网 / 表不存在）就置 null —— 界面据此整体隐藏使用情况，
   *  而不是显示一片「0 条」把财务吓一跳。 */
  async loadUsage() {
    this.usage = null;
    this.usageMax = 0;
    this.usageSrc = this.sourceOf(this.current);
    if (!this.usageSrc) return;
    try {
      const { data, error } = await sb.from(this.usageSrc.table)
        .select(this.usageSrc.col).limit(20000);
      if (error) throw error;
      const m = new Map();
      (data || []).forEach(r => {
        const raw = r[this.usageSrc.col];
        const v = (raw === null || raw === undefined) ? '' : String(raw).trim();
        if (v) m.set(v, (m.get(v) || 0) + 1);
      });
      this.usage = m;
      let max = 0;
      m.forEach(n => { if (n > max) max = n; });
      this.usageMax = max;
    } catch (e) { /* 静默降级：没有使用情况也不影响编辑与保存 */ }
  },

  usageOf(v) {
    if (!this.usage) return null;
    return this.usage.get(String(v).trim()) || 0;
  },

  /** 数据里在用、选项表里没有的值。
   *  wasOption=true 表示它本来是选项、被删掉或改名了 —— 保存后会变成孤儿值，优先提醒；
   *  false 表示它是从台账里直接写进去的（combo 字段 / 「其他」自由填写），可一键收编。 */
  outsideValues() {
    if (!this.usage) return [];
    const now = new Set(this.items.map(v => String(v).trim()).filter(Boolean));
    const wasOption = new Set(this.loadedVals);
    return [...this.usage.entries()]
      .filter(([v]) => !now.has(v))
      .map(([v, n]) => ({ value: v, n, wasOption: wasOption.has(v) }))
      .sort((a, b) => (b.wasOption - a.wasOption) || (b.n - a.n) || a.value.localeCompare(b.value, 'zh'));
  },

  /* ================= 渲染 ================= */

  /** 左栏：一个类别条目（项数与表单下拉同源 —— 都走 Dicts.get） */
  catItem(c) {
    const managed = Dicts.isManaged(c.key);
    const active = c.key === this.current;
    return `
      <button type="button" class="dc-item ${active ? 'is-active' : ''}" data-cat="${c.key}"
        ${active ? 'aria-current="true"' : ''} title="${managed ? '已自定义' : '内置默认（尚未落库）'}">
        <span class="dc-dot ${managed ? 'is-db' : ''}" aria-hidden="true"></span>
        <span class="dc-name">${Utils.escapeHtml(c.label)}</span>
        <span class="dc-num">${Dicts.get(c.key).length}</span>
      </button>`;
  },

  /** 「在用」单元格：数字 + 一条按最高用量归一的细条（读数量级用，不是精确图表）。
   *  0 用一条空槽表示 —— 空槽本身就是「从未使用」的视觉信号，不必再写字。 */
  usageCell(v) {
    if (!this.usage) return '';
    const n = this.usageOf(v);
    const pct = n ? Math.max(4, Math.round(n / Math.max(1, this.usageMax) * 100)) : 0;
    const tip = n ? `当前有 ${n} ${this.usageSrc.unit}使用这个值`
                  : '当前没有记录使用这个值（可以安全删除）';
    return `<span class="du-cell" title="${tip}">
        <span class="du-meter${n ? '' : ' is-zero'}" aria-hidden="true"><i style="width:${pct}%"></i></span>
        <span class="du-n${n ? '' : ' is-zero'}">${n || '—'}</span>
      </span>`;
  },

  rows() {
    if (!this.items.length) {
      return `<tr><td colspan="${this.usage ? 4 : 3}" class="dict-empty">
          <b>这一类还没有选项</b>
          <span>表单下拉会回退为内置默认值，用下方输入框添加第一条</span>
        </td></tr>`;
    }
    return this.items.map((v, i) => `
      <tr data-idx="${i}" data-orig="${Utils.escapeHtml(v)}">
        <td class="dt-idx">${i + 1}</td>
        <td class="dt-val">
          <input class="dict-item" data-idx="${i}" value="${Utils.escapeHtml(v)}"
                 aria-label="第 ${i + 1} 项选项内容">
        </td>
        ${this.usage ? `<td class="dt-use">${this.usageCell(v)}</td>` : ''}
        <td class="dt-act">
          <div class="dt-acts">
            <button type="button" class="iconbtn" data-act="up" data-idx="${i}"
              title="上移" aria-label="上移" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button type="button" class="iconbtn" data-act="down" data-idx="${i}"
              title="下移" aria-label="下移" ${i === this.items.length - 1 ? 'disabled' : ''}>↓</button>
            <button type="button" class="iconbtn is-del" data-act="del" data-idx="${i}"
              title="删除" aria-label="删除">✕</button>
          </div>
        </td>
      </tr>`).join('');
  },

  /** 底部一致性卡片：数据里在用、选项表里没有的值。
   *  没有任何问题时也要占位（给一句确认），否则右栏下方会空出一大块。 */
  consistHTML() {
    const last = this.items.length ? this.items[this.items.length - 1] : '';
    void last;
    if (!this.usageSrc) return '';
    if (this.usage === null) {
      return `
        <div class="dm-consist">
          <div class="du-head"><b>与台账数据的一致性</b></div>
          <p class="du-note">暂时读不到台账数据（权限或网络原因），无法核对「选项」与「实际数据」。
            这不影响编辑与保存。</p>
        </div>`;
    }
    const rows = this.outsideValues();
    const total = [...this.usage.values()].reduce((a, b) => a + b, 0);
    const used = this.items.filter(v => this.usageOf(v) > 0).length;
    const lost = rows.filter(o => o.wasOption);
    const lostN = lost.reduce((s, o) => s + o.n, 0);

    const list = rows.map((o, i) => `
      <li class="du-row ${o.wasOption ? 'is-opt' : ''}">
        <span class="du-val" title="${Utils.escapeHtml(o.value)}">${Utils.escapeHtml(o.value)}</span>
        <span class="du-src">${o.wasOption ? '原是选项' : '来自台账'}</span>
        <span class="du-cnt">${o.n} ${this.usageSrc.unit}</span>
        <button type="button" class="btn btn-xs" data-act="adopt" data-or="${i}">加入选项</button>
      </li>`).join('');

    return `
      <div class="dm-consist">
        <div class="du-head">
          <b>与台账数据的一致性</b>
          <span class="du-scope">作用于 ${this.usageSrc.where}</span>
          <span class="du-sum">本类别 ${this.items.length} 项 · ${used} 项在用 ·
            ${total} ${this.usageSrc.unit}${rows.length ? ' · 选项外 ' + rows.length + ' 个值' : ''}</span>
        </div>
        ${lost.length ? `<div class="du-alert">保存后这 ${lost.length} 个选项将从选项表移除，
          而它们仍被 ${lostN} ${this.usageSrc.unit}引用 —— 那些记录会变成孤儿值（值还在，
          但下拉里选不到、筛不出来）。</div>` : ''}
        ${rows.length
          ? `<ul class="du-list">${list}</ul>`
          : `<p class="du-ok">数据里的值都在上面的选项表中 ✓</p>`}
        ${used ? `<p class="du-tip">删除一个正在被使用的选项不会改动台账里的值，
          但那条记录会变成孤儿值：筛选里查不到、编辑时也选不回来。
          所以删除前与保存前都会先报出影响多少条。</p>` : ''}
      </div>`;
  },

  render() {
    const page = document.getElementById('page-dict');
    if (!page) return;
    const cats = DICT_CATEGORIES;
    const cur = cats.find(c => c.key === this.current) || cats[0];
    const managed = Dicts.isManaged(this.current);
    /* 保存按钮何时可用：
       - 有未保存修改 → 可保存
       - 该类别还只是内置默认（未落库）→ 也可保存，否则财务没有入口把它固化进数据库 */
    const canSave = this.dirty || !managed;

    page.innerHTML = `
      <div class="page-head">
        <h2>选项管理</h2>
        <span class="muted">表单下拉的取值与顺序在此维护，保存后全系统即时生效</span>
      </div>
      <div class="dict-panel">
        <aside class="dict-cats">
          <div class="dc-head"><span>类别</span><span class="dc-total">${cats.length}</span></div>
          <div class="dc-list">${cats.map(c => this.catItem(c)).join('')}</div>
          <div class="dc-legend">
            <span><i class="dc-dot is-db"></i>已自定义</span>
            <span><i class="dc-dot"></i>内置默认</span>
          </div>
        </aside>
        <section class="dict-main" id="dict-main">
          <header class="dm-head">
            <h3>${Utils.escapeHtml(cur.label)}</h3>
            <span class="tag ${managed ? 'tag-blue' : 'tag-gray'}">${managed ? '已自定义' : '内置默认（未落库）'}</span>
            <span class="dm-warn ${this.dirty ? '' : 'hidden'}">有未保存的修改</span>
            <span class="dm-count">共 ${this.items.length} 项</span>
          </header>
          <div class="dm-body">
            <table class="dict-table">
              <thead><tr>
                <th class="dt-idx">#</th>
                <th class="dt-val">选项内容</th>
                ${this.usage ? '<th class="dt-use">在用</th>' : ''}
                <th class="dt-act">操作</th>
              </tr></thead>
              <tbody>${this.rows()}</tbody>
            </table>
          </div>
          ${this.consistHTML()}
          <footer class="dm-foot">
            <div class="dm-add">
              <input class="ipt" id="dict-new" placeholder="新增选项内容…" aria-label="新增选项内容">
              <button type="button" class="btn" data-act="add">添加</button>
            </div>
            <button type="button" class="btn ${canSave ? 'btn-primary' : ''}" data-act="save"
              ${canSave ? '' : 'disabled'}>${managed ? '保存修改' : '保存并启用'}</button>
            <div id="dict-error" class="editor-error hidden"></div>
          </footer>
        </section>
      </div>`;

    this.bind();
  },

  /* ================= 事件 ================= */

  bind() {
    const page = document.getElementById('page-dict');

    // 切换类别（有未保存修改时先确认）
    page.querySelectorAll('.dc-item').forEach(b => b.addEventListener('click', async () => {
      const key = b.dataset.cat;
      if (key === this.current) return;
      if (this.dirty) {
        const ok = await Utils.confirm('当前类别有未保存的修改，切换后将丢失。确定切换？',
          { title: '切换类别', confirmText: '放弃修改' });
        if (!ok) return;
      }
      this.current = key;
      await this.load(key);
    }));

    // 就地编辑：不整体重渲染（会丢焦点），只同步头部、保存按钮与使用情况
    page.querySelectorAll('.dict-item').forEach(inp => inp.addEventListener('input', () => {
      this.items[Number(inp.dataset.idx)] = inp.value;
      this.dirty = true;
      this.syncHead();
      this.syncUsage();
    }));

    // 新增：回车即添加，省一次鼠标移动
    const newInput = page.querySelector('#dict-new');
    newInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.addItem(); }
    });
    page.querySelector('[data-act="add"]').addEventListener('click', () => this.addItem());

    page.querySelector('[data-act="save"]').addEventListener('click', () => this.save());
    this.bindRowActs();
    this.bindAdopt();
  },

  /** 一致性卡片里的「加入选项」（卡片会被 syncUsage 替换，故每次都要重新挂） */
  bindAdopt() {
    const page = document.getElementById('page-dict');
    if (!page) return;
    page.querySelectorAll('[data-act="adopt"]').forEach(b =>
      b.addEventListener('click', () => this.adopt(Number(b.dataset.or))));
  },

  adopt(i) {
    const o = this.outsideValues()[i];
    if (!o || this.items.includes(o.value)) return;
    this.items.push(o.value);
    this.dirty = true;
    this.render();
    Utils.toast(`已把「${o.value}」加入选项表，点「保存修改」后正式生效`, 'info');
  },

  bindRowActs() {
    const page = document.getElementById('page-dict');

    page.querySelectorAll('[data-act="up"]').forEach(a => a.addEventListener('click', () => {
      const i = Number(a.dataset.idx);
      if (i <= 0) return;
      [this.items[i - 1], this.items[i]] = [this.items[i], this.items[i - 1]];
      this.dirty = true;
      this.render();
      this.focusRow(i - 1, 'up');
    }));

    page.querySelectorAll('[data-act="down"]').forEach(a => a.addEventListener('click', () => {
      const i = Number(a.dataset.idx);
      if (i >= this.items.length - 1) return;
      [this.items[i + 1], this.items[i]] = [this.items[i], this.items[i + 1]];
      this.dirty = true;
      this.render();
      this.focusRow(i + 1, 'down');
    }));

    /* 删除要二次确认：文字按钮只有 11×15px 且紧贴上移/下移，误点后若再点保存
       就真的从数据库删掉了 —— 这条路必须有个刹车。
       确认框还要报出**影响面**：这个值当前被多少条记录引用。0 条时明说「可以安全删除」，
       否则财务每次都要停下来自己猜「删了会不会把台账搞乱」。 */
    page.querySelectorAll('[data-act="del"]').forEach(a => a.addEventListener('click', async () => {
      const i = Number(a.dataset.idx);
      const v = this.items[i];
      const n = this.usageOf(v);
      const unit = this.usageSrc ? this.usageSrc.unit : '';
      const msg = n === null
        ? `确定删除选项「${v}」？\n保存后将从数据库中移除。`
        : n > 0
          ? `确定删除选项「${v}」？\n\n当前有 ${n} ${unit}在使用这个值。`
            + `删除后这些记录里的值不会被改动，但会变成「数据里有、选项表里没有」的孤儿值`
            + ` —— 下拉里选不回来，筛选也筛不到。\n\n保存后将从数据库中移除。`
          : `确定删除选项「${v}」？\n\n当前没有记录在使用这个值，可以安全删除。\n保存后将从数据库中移除。`;
      const ok = await Utils.confirm(msg, { title: '删除选项', danger: true, confirmText: '删除' });
      if (!ok) return;
      this.items.splice(i, 1);
      this.dirty = true;
      this.render();
      // 焦点落到同一位置的那一行，连删多条时不用重新找
      if (!this.items.length) document.getElementById('dict-new')?.focus();
      else this.focusRow(Math.min(i, this.items.length - 1), 'del');
    }));
  },

  /** 重渲染后把焦点放回原位置（否则键盘/连点操作每次都要重新定位） */
  focusRow(i, prefer) {
    const btn = document.querySelector(`#page-dict [data-act="${prefer}"][data-idx="${i}"]`);
    if (btn && !btn.disabled) { btn.focus(); return; }
    document.querySelector(`#page-dict .dict-item[data-idx="${i}"]`)?.focus();
  },

  /** 局部同步头部状态（输入时用，避免重渲染丢焦点） */
  syncHead() {
    const main = document.getElementById('dict-main');
    if (!main) return;
    const managed = Dicts.isManaged(this.current);
    const warn = main.querySelector('.dm-warn');
    if (warn) warn.classList.toggle('hidden', !this.dirty);
    const cnt = main.querySelector('.dm-count');
    if (cnt) cnt.textContent = `共 ${this.items.length} 项`;
    const btn = main.querySelector('[data-act="save"]');
    if (btn) {
      const can = this.dirty || !managed;
      btn.disabled = !can;
      btn.classList.toggle('btn-primary', can);
      btn.textContent = managed ? '保存修改' : '保存并启用';
    }
  },

  /** 就地改名后同步「在用」列与一致性卡片 —— 改名会让原值当场变成孤儿值，
   *  数字必须跟着变，否则财务看不到自己刚刚制造的问题。 */
  syncUsage() {
    if (!this.usage) return;
    const main = document.getElementById('dict-main');
    if (!main) return;
    main.querySelectorAll('.dict-table tbody tr').forEach(tr => {
      const cell = tr.querySelector('.dt-use');
      const inp = tr.querySelector('.dict-item');
      if (cell && inp) cell.innerHTML = this.usageCell(inp.value);
    });
    const box = main.querySelector('.dm-consist');
    if (box) {
      box.outerHTML = this.consistHTML();   // 替换会带走卡片内的事件，故紧跟着重新挂
      this.bindAdopt();
    }
  },

  addItem() {
    const inp = document.getElementById('dict-new');
    if (!inp) return;
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if (this.items.includes(v)) { Utils.toast('该选项已存在', 'error'); inp.select(); return; }
    this.items.push(v);
    this.dirty = true;
    this.render();
    const again = document.getElementById('dict-new');
    again?.focus();
    const body = document.querySelector('#page-dict .dm-body');
    if (body) body.scrollTop = body.scrollHeight;   // 连加多条时新行要在视野内
  },

  /* ================= 保存 ================= */

  /**
   * 整类重写：先删后插，保证 sort_order 就是列表顺序。
   *
   * ⚠ PostgREST 的单次请求没有事务，delete 与 insert 是两个请求 ——
   *   一旦 delete 成功而 insert 失败，该类选项就被清空且无法恢复。
   *   故这里先取一份回滚快照，插入失败时按原样写回（补偿事务）。
   *   快照必须取自「删除前的数据库内容」而不是内存里的 items：
   *   未落库的类别删 0 行，快照若用了内置默认值，回滚反而会把它误写成"已自定义"。
   */
  async save() {
    const cur = this.current;
    const errBox = document.getElementById('dict-error');
    const btn = document.querySelector('#page-dict [data-act="save"]');
    const managed = Dicts.isManaged(cur);
    const restoreBtn = () => {
      if (!btn) return;
      btn.disabled = !(this.dirty || !managed);
      btn.classList.toggle('btn-primary', !btn.disabled);
      btn.textContent = managed ? '保存修改' : '保存并启用';
    };
    const fail = (msg) => {
      if (errBox) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
      Utils.toast('保存失败', 'error');
      restoreBtn();
    };

    if (errBox) errBox.classList.add('hidden');

    // 清洗：去空、去重
    const clean = [...new Set(this.items.map(v => v.trim()).filter(Boolean))];
    if (clean.length !== this.items.length) {
      this.items = clean;
      this.dirty = true;
      this.render();
      Utils.toast('已自动去除空项/重复项，请再次点击保存', 'info');
      return;
    }

    /* 影响面确认：这一步比「删除时逐个确认」重要得多 —— 删除只影响一项，
       而保存会一次性把整类重写，改名/删除攒在同一批里发生时，财务很难自己算清
       到底会甩下多少条孤儿记录。所以保存前把总数摆出来。 */
    if (this.usage) {
      const lost = this.outsideValues().filter(o => o.wasOption && o.n > 0);
      if (lost.length) {
        const total = lost.reduce((s, o) => s + o.n, 0);
        const names = lost.slice(0, 5).map(o => `「${o.value}」${o.n}`).join('、');
        const ok = await Utils.confirm(
          `本次保存将移除 ${lost.length} 个仍在使用中的选项，共影响 ${total} ${this.usageSrc.unit}：\n\n`
          + names + (lost.length > 5 ? ` 等 ${lost.length} 个` : '')
          + `\n\n这些记录里的值不会被改动，但会变成「数据里有、选项表里没有」的孤儿值，`
          + `之后下拉里选不回来。建议先在上方把它们改掉，或点「加入选项」保留。`,
          { title: '移除在用选项', danger: true, confirmText: '仍然保存' });
        if (!ok) { restoreBtn(); return; }
      }
    }

    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }

    // ① 回滚快照
    const { data: before, error: readErr } = await sb.from('ar_dict')
      .select('value, sort_order').eq('category', cur).order('sort_order');
    if (readErr) { fail('保存失败：' + readErr.message); return; }

    // ② 删旧
    const { error: delErr } = await sb.from('ar_dict').delete().eq('category', cur);
    if (delErr) { fail('保存失败：' + delErr.message); return; }

    // ③ 插新
    if (clean.length) {
      const { error: insErr } = await sb.from('ar_dict')
        .insert(clean.map((v, i) => ({ category: cur, value: v, sort_order: i + 1 })));
      if (insErr) {
        let note = '（已自动回滚，数据未丢失）';
        if ((before || []).length) {
          const { error: rbErr } = await sb.from('ar_dict').insert(
            before.map(r => ({ category: cur, value: r.value, sort_order: r.sort_order })));
          if (rbErr) note = `（自动回滚失败：${rbErr.message}，请联系管理员）`;
        }
        fail('保存失败：' + insErr.message + note);
        return;
      }
    }

    this.dirty = false;
    this.loadedVals = [...clean];   // 保存成功后，这批才算「原本就是选项」
    await Dicts.load();     // 刷新全局字典缓存
    Utils.toast('选项已保存，全系统即时生效', 'success');
    this.render();
  },
};
</script>
<script>
/* ---------- 模拟数据 & 假 Supabase（仅预览用） ---------- */
/* DB_DICT 里的类别 = 已在 ar_dict 入库；不在的 = 内置默认（未入库）。
   刻意让 project_status（默认打开的第一个类别）不在库里 —— 那是最需要看清的
   一种状态：灰色标签「内置默认（未落库）」+ 主色「保存并启用」按钮。 */
const DB_DICT = {
  debt_status: ['正常', '逾期', '诉讼', '和解'],
  client_attr: ['内部单位', '政府部门--省', '政府部门--市', '政府部门--县',
    '政府部门--县以下', '煤矿集团--晋能控股', '煤矿集团--山西焦煤', '煤矿集团--潞安化工',
    '煤矿集团--华阳新材', '煤矿集团--华新燃气', '煤矿集团--其他煤矿', '社会客户-省内',
    '社会客户-省外', '社会客户-海外', '其他'],
  unit: ['物化院', '六勘院', '测绘院', '禹地公司'],
  comm_method: ['电话', '上门拜访', '邮件', '微信', '函件+电话', '函件+微信'],
};

/* 台账 / 附件侧的值分布 —— 「在用」列与孤儿值的 mock 数据源。
   刻意让 client_attr 里出现一个不在 DB_DICT 里的值（煤矿集团--晋城）：
   那就是「数据里有、选项表里没有」的孤儿值，本页要能把它摆出来。
   每列按 count 展开后从第 0 行开始顺序填，各列覆盖行数不同（高行会留空）——
   这样每个值的条数就等于 count 本身，断言可以逐一对账。 */
const DICT_COUNTS = {
  project_status: { '完工': 4, '施工中': 6, '中止': 2, '取消或作废': 1 },
  final_method:   { '合同金额': 8, '工作量': 5 },
  debt_status:    { '正常': 5, '逾期': 6, '诉讼': 2, '和解': 2 },
  client_attr:    { '内部单位': 3, '政府部门--县': 2, '煤矿集团--晋能控股': 4,
                    '煤矿集团--潞安化工': 2, '社会客户-省内': 3, '其他': 1,
                    '煤矿集团--晋城': 2 },              /* ← 不在 DB_DICT 里：孤儿值 */
  comm_method:    { '电话': 4, '上门拜访': 3, '邮件': 2, '微信': 3, '函件+电话': 1 },
  feedback:       { '承认欠款，但资金紧张': 3, '拒接电话': 2, '对质量提出异议': 2, '承认欠款，要求分期': 2 },
  progress_note:  { '已发送第二次催款函': 3, '停工': 2, '需协商': 2, '已安排对账': 2 },
  next_plan:      { '升级催收手段': 3, '需实地调查': 2, '跟踪付款进度': 2, '提供分期计划': 2 },
  unit:           { '物化院': 5, '六勘院': 3, '测绘院': 2, '禹地公司': 1 },
  work_nature:    { '二、三维地震': 3, '宅基地': 2, '农经权': 2, '房地一体': 2, '其他测绘': 1,
                    '工民建勘察': 2, '报告编写、设计方案': 1, '地灾评估、勘察、设计': 2, '市场地质': 1,
                    '价款项目': 1, '综合物探': 2, '基础施工': 1, '灾害施工': 1, '生态修复': 1,
                    '化验、基础检测': 1, '土工试验': 1, '其他': 1 },
  sector:         { '能源资源勘查开发': 3, '生态保护修复': 2, '地质灾害治理': 2, '工程勘察与施工': 2,
                    '地质延伸产业': 2, '实验测试': 2, '测绘地理信息': 2, '海外勘查贸易': 1 },
};
const ATTACH_COUNTS = { '决算': 5, '中止证明': 2, '其他': 1 };

const expand = counts => {
  const out = [];
  Object.keys(counts).forEach(v => { for (let i = 0; i < counts[v]; i++) out.push(v); });
  return out;
};
/* 类别 → 台账列名，与产品同源（FIELD_DEFS 的 dict 反查），不在这里另抄一份映射 */
const MOCK_ROWS = [];
Object.keys(DICT_COUNTS).forEach(c => {
  const f = FIELD_DEFS.find(x => x.dict === c);
  if (!f) return;
  expand(DICT_COUNTS[c]).forEach((v, i) => {
    MOCK_ROWS[i] = MOCK_ROWS[i] || {};
    MOCK_ROWS[i][f.key] = v;
  });
});
const MOCK_ATTACH = expand(ATTACH_COUNTS).map((v, i) => ({ id: i + 1, category: v }));

/* 最小可用的 PostgREST 链式替身：支持 select/eq/order/limit 与 delete/insert */
function makeChain(table) {
  let cat = null, op = 'select', payload = null;
  const o = {
    select: () => o, order: () => o, limit: () => o,
    delete: () => { op = 'delete'; return o; },
    insert: rows => { op = 'insert'; payload = rows; return o; },
    eq: (k, v) => { if (k === 'category') cat = v; return o; },
    then: (res, rej) => {
      if (op === 'select') {
        /* 台账 / 附件：只用来算「在用」条数与找孤儿值，判据在调用方，这里原样返回整行 */
        if (table === 'ar_ledger') return Promise.resolve({ data: MOCK_ROWS, error: null }).then(res, rej);
        if (table === 'ar_attachments') return Promise.resolve({ data: MOCK_ATTACH, error: null }).then(res, rej);
        if (cat === null) {   /* Dicts.load()：不带 eq，取全部类别 */
          const all = [];
          Object.keys(DB_DICT).forEach(c => DB_DICT[c].forEach((v, i) => all.push({ category: c, value: v, sort_order: i + 1 })));
          return Promise.resolve({ data: all, error: null }).then(res, rej);
        }
        const vals = DB_DICT[cat] || [];
        return Promise.resolve({ data: vals.map((v, i) => ({ value: v, sort_order: i + 1 })), error: null }).then(res, rej);
      }
      if (op === 'delete') { delete DB_DICT[cat]; return Promise.resolve({ error: null }).then(res, rej); }
      DB_DICT[cat] = (payload || []).map(r => r.value);
      return Promise.resolve({ error: null }).then(res, rej);
    }
  };
  return o;
}
const sb = { from: t => makeChain(t) };

const Auth = { isAdmin: true, isSuperAdmin: true, currentUser: { id: 'u1', name: '韩志远' } };

(async () => {
  await Dicts.load();
  const h = location.hash;
  const has = t => h.indexOf(t) >= 0;
  /* 场景与类别解耦：类别由 hash 里的关键词挑，测量用哪个类别就写哪个关键词。
     #measure 跑在 client_attr（有孤儿值）上；#measure-clean 跑在默认的 project_status
     （4 项）上 —— 后者才是「右栏留白」最初被投诉的那个场景。 */
  const pick = () => {
    if (['#managed', '#orphan', '#renamed', '#saveimpact', '#confirm'].indexOf(h) >= 0) return 'client_attr';
    if (has('many')) return 'work_nature';
    if (has('attach')) return 'attach_category';
    if (has('dirty')) return 'debt_status';
    if (has('measure-clean')) return 'project_status';
    if (has('measure')) return 'client_attr';
    return 'project_status';
  };
  await DictAdmin.load(pick());
  const doMeasure = has('measure');

  if (has('dirty')) {
    const inp = document.querySelector('.dict-item');
    inp.value = inp.value + '·改';
    inp.dispatchEvent(new Event('input'));
  }

  /* 改名首项「内部单位」（3 条在用）—— 原值当场变成孤儿值，
     一致性卡片应立刻出现警示并在列表里列出这个值 */
  if (has('renamed') || has('saveimpact')) {
    const inp = document.querySelector('.dict-item');
    inp.value = '内部单位·改';
    inp.dispatchEvent(new Event('input'));
  }

  if (has('confirm')) {
    document.querySelector('.dict-table tbody [data-act="del"]').click();
  }

  /* 保存前的影响面确认：只把「内部单位」改名后点保存，
     应当先弹出「将移除 1 个仍在使用的选项，共影响 3 条台账」的确认框 */
  if (has('saveimpact')) {
    document.querySelector('#page-dict [data-act="save"]').click();
  }

  if (doMeasure) {
    const box = e => { const r = e.getBoundingClientRect(); return 'L' + Math.round(r.left) + ' x' + Math.round(r.top) + ' w' + Math.round(r.width) + ' h' + Math.round(r.height); };
    const out = [];
    const q = s => document.querySelector(s);
    const qa = s => [...document.querySelectorAll(s)];

    out.push('面板: ' + box(q('.dict-panel')) + '  左栏: ' + box(q('.dict-cats')) + '  右栏: ' + box(q('.dict-main')));
    out.push('视口高=' + window.innerHeight + '  面板高=' + Math.round(q('.dict-panel').getBoundingClientRect().height)
      + '  面板底缘 y=' + Math.round(q('.dict-panel').getBoundingClientRect().bottom)
      + '  选项行数=' + qa('.dict-table tbody tr').length);
    /* 右栏空白：表格底缘到一致性卡片顶缘的距离 —— 这就是「选项管理右栏留白」的量化口径。
       不量「.dm-body 底缘 − 末块底缘」：卡片用 margin-top:auto 贴底，那个差值恒为 0，
       会把中间的空白完全掩盖掉。 */
    const consist0 = q('.dm-consist');
    const gapOf = () => {
      const tb = q('.dict-table');
      if (!tb) return 0;
      const bottom = tb.getBoundingClientRect().bottom;
      const next = consist0 ? consist0.getBoundingClientRect().top : q('.dm-body').getBoundingClientRect().bottom;
      return Math.round(next - bottom);
    };
    out.push('右栏空白=' + gapOf() + 'px（表格底缘 → 卡片顶缘；越大越像没做完）');
    out.push('body 高=' + Math.round(document.body.getBoundingClientRect().height) + '（应≈外壳高度，不该出现第二条滚动条）');

    const rows = qa('.dict-table tbody tr');
    out.push('行数=' + rows.length + '  行高集合=' + [...new Set(rows.map(r => Math.round(r.getBoundingClientRect().height)))]);
    if (rows[0]) {
      const ths = qa('.dict-table thead th');
      out.push('表头各格: ' + ths.map((c, i) => i + ':' + box(c)).join(' | '));
      out.push('首行各格: ' + [...rows[0].children].map((c, i) => i + ':' + box(c)).join(' | '));
      out.push('表头/表体逐列宽度相等: ' + ths.every((th, i) => Math.round(th.getBoundingClientRect().width) === Math.round(rows[0].children[i].getBoundingClientRect().width)));
    }
    /* 可点击目标：WCAG 2.5.8 下限 24×24 */
    const acts = qa('.dict-table tbody tr:first-child [data-act]');
    out.push('操作按钮 ' + acts.length + ' 个: ' + acts.map(a => a.dataset.act + '[' + Math.round(a.getBoundingClientRect().width) + '×' + Math.round(a.getBoundingClientRect().height) + (a.disabled ? ' 禁用' : '') + ']').join(' '));
    out.push('最小点击目标边长=' + Math.min(...acts.map(a => Math.min(a.getBoundingClientRect().width, a.getBoundingClientRect().height))).toFixed(1) + 'px（须 ≥24）');
    /* 相邻按钮中心距：越小越容易误点 */
    const cs = acts.map(a => { const r = a.getBoundingClientRect(); return r.left + r.width / 2; });
    out.push('相邻按钮中心距=' + cs.slice(1).map((c, i) => (c - cs[i]).toFixed(0)).join('/') + 'px');
    /* 输入框默认是否"隐形" */
    const inp = q('.dict-item');
    out.push('输入框默认边框色=' + getComputedStyle(inp).borderTopColor + '（应为 transparent）');

    /* 左栏类别索引（注意限定 .dc-list —— 底部图例里也有 .dc-dot，不限定会数错）。
       同时逐行核对名称有没有被省略号截掉：左栏固定 212px，类别名最长的
       「单位（债权单位）」需要 ~152px，余量很紧。 */
    const caps = qa('.dc-list .dc-item');
    /* 注意别用 scrollWidth 当"文字宽度"：overflow:hidden 的元素在内容不溢出时
       scrollWidth 会退化成 clientWidth，读出来等于盒子宽度，会误导判断。
       要真宽就用 Range 量文字本身。 */
    const textW = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    const nameW = Math.max(...caps.map(c => Math.round(textW(c.querySelector('.dc-name')))));
    const cw = caps.map(c => Math.round(c.querySelector('.dc-name').clientWidth));
    const uniform = cw.every(v => Math.abs(v - cw[0]) < 1);
    out.push('左栏类别 ' + caps.length + ' 行，行高集合=' + [...new Set(caps.map(c => Math.round(c.getBoundingClientRect().height)))]
      + '，最宽名称实宽=' + nameW + 'px');
    out.push('名称列宽: ' + (uniform
      ? cw[0] + 'px（固定列，余量 ' + (cw[0] - nameW) + 'px）'
      : '按胶囊内容自适应（窄屏横向滚动形态）'));
    const cut = caps.filter(c => { const n = c.querySelector('.dc-name'); return n.scrollWidth > n.clientWidth + 1; });
    out.push('名称被截断的类别: ' + (cut.length ? cut.map(c => c.querySelector('.dc-name').textContent).join(' , ') : '无 ✓'));
    out.push('左栏溢出: ' + (q('.dc-list').scrollHeight > q('.dc-list').clientHeight + 1 ? '需滚动（' + q('.dc-list').scrollHeight + '>' + q('.dc-list').clientHeight + '）' : '无需滚动 ✓'));
    out.push('已自定义标记=' + qa('.dc-list .dc-dot.is-db').length + ' 个 / 内置默认=' + qa('.dc-list .dc-dot:not(.is-db)').length + ' 个（合计应为 ' + caps.length + '）');
    out.push('当前类别 isManaged=' + Dicts.isManaged(DictAdmin.current) + '  Dicts.cache 键=' + Object.keys(Dicts.cache).join(','));

    out.push('新增输入框宽=' + Math.round(q('#dict-new').getBoundingClientRect().width) + 'px（旧版 904px 占满整行）');
    const sb = q('[data-act="save"]');
    out.push('保存按钮: ' + box(sb) + '  disabled=' + sb.disabled + '  文案=' + sb.textContent.trim());
    out.push('左右栏分界 x=' + Math.round(q('.dict-cats').getBoundingClientRect().right) + ' = 右栏左缘 x=' + Math.round(q('.dict-main').getBoundingClientRect().left)
      + '  Δ=' + Math.round(q('.dict-main').getBoundingClientRect().left - q('.dict-cats').getBoundingClientRect().right));

    /* —— 「在用」列与一致性卡片（本轮新增的两块） —— */
    const useCells = qa('.dict-table tbody .dt-use');
    out.push('当前类别=' + DictAdmin.current + '  选项来源=' + DictAdmin.usageSrc.table + '.' + DictAdmin.usageSrc.col);
    out.push('在用列表头=' + qa('.dict-table thead .dt-use').length + ' 个，单元格=' + useCells.length
      + ' 个（应与选项行数相同），首格=' + (useCells[0] ? useCells[0].textContent.trim() : '（无）'));
    const consist = q('.dm-consist');
    out.push('一致性卡片: ' + (consist ? box(consist) : '（没渲染 —— 应该有）'));
    const alertEl = q('.du-alert');
    out.push('  警示: ' + (alertEl ? alertEl.textContent.trim() : '（无；在 #renamed/#saveimpact 场景应出现）'));
    const orRows = qa('.du-row');
    out.push('  选项外的值 ' + orRows.length + ' 个 —— '
      + (orRows.length ? orRows.map(r => r.querySelector('.du-val').textContent + '／'
          + r.querySelector('.du-src').textContent + '／'
          + r.querySelector('.du-cnt').textContent).join('  |  ') : '（本类别数据里的值都在选项表中）'));
    out.push('  与台账对账: ' + DictAdmin.current + ' 覆盖 ' + [...DictAdmin.usage.values()].reduce((a, b) => a + b, 0)
      + ' ' + DictAdmin.usageSrc.unit + '，去重后 ' + DictAdmin.usage.size + ' 个值；选项表 ' + DictAdmin.items.length + ' 项');
    /* 一键收编：选项表 +1、选项外的值 −1（没有孤儿值时无事可做，不算失败） */
    const adoptBtn = q('[data-act="adopt"]');
    if (adoptBtn) {
      const beforeN = DictAdmin.items.length, beforeOr = orRows.length;
      adoptBtn.click();
      const okAdopt = DictAdmin.items.length === beforeN + 1 && qa('.du-row').length === beforeOr - 1;
      out.push('  点「加入选项」: 选项数 ' + beforeN + ' → ' + DictAdmin.items.length
        + '，选项外的值 ' + beforeOr + ' → ' + qa('.du-row').length + (okAdopt ? ' ✓' : ' ✗'));
    } else {
      out.push('  没有需要收编的值，无需此动作 ✓');
    }

    const d = document.createElement('pre');
    /* white-space:pre 而不是 pre-wrap —— 换行会让读数穿插在后面板内容里看不清。
       字号 16px 是必须的：截图工具会把 1440 宽的图缩到 1080 再给模型看，
       10px 的读数缩放后只剩 7.5px，等于没读。 */
    d.style.cssText = 'position:fixed;inset:0 0 auto 0;z-index:9999;margin:0;padding:8px 10px;' +
      'background:#fff;color:#111;border-bottom:2px solid #c00;font:16px/1.5 monospace;white-space:pre;overflow-x:auto';
    d.textContent = 'MEASURE>>\n' + out.join('\n');
    document.body.appendChild(d);
  }

  document.title = '选项管理预览 · 已渲染';
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
